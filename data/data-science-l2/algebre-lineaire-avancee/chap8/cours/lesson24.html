<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue en Algèbre Linéaire Avancée !",
    "contenu": "<div style='font-size: 1.1rem; line-height: 1.8;'><p style='font-weight: bold; font-size: 1.2rem;'>Leçon 24 : Problèmes d'Optimisation Linéaire</p><p>Chers étudiants, bienvenue à cette dernière leçon du cours ! Aujourd'hui, nous allons aborder un sujet fondamental :</p><ul style='list-style-type: none; padding-left: 10px;'><li>📊 <strong>Les moindres carrés</strong> : la méthode de base pour la régression linéaire</li><li>📐 <strong>Les équations normales</strong> : la solution analytique du problème</li><li>🧮 <strong>La pseudo-inverse</strong> : résoudre par SVD même quand la matrice n'est pas inversible</li><li>⚡ <strong>La régularisation</strong> : Ridge et Lasso pour éviter le sur-apprentissage</li></ul><div style='background: #f0f4ff; padding: 12px; border-radius: 8px; margin-top: 15px;'><p style='margin: 0;'><strong>🎯 Objectifs de la leçon :</strong></p><ul style='margin-top: 5px;'><li>Formuler un problème de moindres carrés</li><li>Résoudre par l'équation normale</li><li>Résoudre par SVD (pseudo-inverse)</li><li>Appliquer en régression linéaire multiple</li></ul></div></div>",
    "texteParle": "Bonjour à tous et bienvenue dans cette dernière leçon d'algèbre linéaire avancée. Nous allons aujourd'hui aborder la leçon numéro 24 intitulée : Problèmes d'Optimisation Linéaire. Cette leçon est particulièrement importante car elle fait le lien entre toute l'algèbre linéaire que nous avons vue et les applications pratiques en data science, notamment la régression linéaire. Nous allons voir comment formuler un problème de moindres carrés, comment le résoudre avec les équations normales, comment utiliser la SVD pour obtenir une solution robuste, et enfin comment régulariser pour éviter le sur-apprentissage. Prenez vos notes, car ces concepts sont au cœur de la data science moderne.",
    "note": "Cette leçon est la synthèse de tout ce que nous avons vu dans ce cours."
  },
  {
    "titre": "Le Problème des Moindres Carrés",
    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 14px; border-radius: 8px; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold; text-align: center; font-size: 1.1rem;'>📌 Formulation du problème</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>Étant donné :</strong></p><ul style='padding-left: 20px;'><li>Une matrice <span style='font-style: italic;'>X</span> de taille <span style='font-style: italic;'>n × p</span> (données)</li><li>Un vecteur <span style='font-style: italic;'>y</span> de taille <span style='font-style: italic;'>n</span> (observations)</li><li>On cherche <span style='font-style: italic;'>β</span> de taille <span style='font-style: italic;'>p</span> qui minimise :</li></ul><div style='text-align: center; font-size: 1.2rem; font-weight: bold; padding: 12px; background: #f5f7fa; border-radius: 6px; margin: 10px 0;'>\\( \\min_{\\beta \\in \\mathbb{R}^p} \\|y - X\\beta\\|^2 \\)</div><p>Ce problème est appelé <strong>problème des moindres carrés</strong>.</p></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #e65100;'><p style='margin: 0;'><strong>📝 Interprétation :</strong> On cherche la combinaison linéaire des colonnes de <span style='font-style: italic;'>X</span> qui approche le mieux <span style='font-style: italic;'>y</span>.</p></div></div>",
    "texteParle": "Commençons par la formulation du problème des moindres carrés. Étant donné une matrice X de taille n fois p qui représente nos données, et un vecteur y de taille n qui représente les observations, on cherche un vecteur bêta de taille p qui minimise la norme au carré de y moins X bêta. En d'autres termes, on cherche la combinaison linéaire des colonnes de X qui approche le mieux le vecteur y. Cette formulation est la base de la régression linéaire multiple, où X contient les variables explicatives et y la variable à expliquer. Le problème est de trouver les coefficients qui minimisent la somme des carrés des résidus.",
    "note": "Le critère des moindres carrés est le plus utilisé en régression linéaire."
  },
  {
    "titre": "Équations Normales",
    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;'><p style='margin: 0; font-weight: bold;'>📐 La solution analytique</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>Théorème :</strong> Si <span style='font-style: italic;'>X<sup>T</sup>X</span> est inversible, la solution unique est :</p><div style='text-align: center; font-size: 1.2rem; font-weight: bold; padding: 12px; background: #f5f7fa; border-radius: 6px; margin: 10px 0;'>\\( \\hat{\\beta} = (X^T X)^{-1} X^T y \\)</div><p>Ce système est appelé <strong>équations normales</strong> :</p><div style='text-align: center; font-size: 1.1rem; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( X^T X \\hat{\\beta} = X^T y \\)</div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #0d47a1;'><p style='margin: 0;'><strong>💡 Interprétation :</strong> La solution correspond à la projection de <span style='font-style: italic;'>y</span> sur l'image de <span style='font-style: italic;'>X</span>.</p></div></div>",
    "texteParle": "La solution du problème des moindres carrés est donnée par les équations normales. Si la matrice X transposée fois X est inversible, alors la solution unique est bêta chapeau égal X transposée fois X inverse fois X transposée fois y. Cette formule est la solution analytique du problème. Elle est obtenue en annulant le gradient de la fonction objectif. Les équations normales s'écrivent X transposée fois X fois bêta chapeau égal X transposée fois y. Interprétée géométriquement, cette solution correspond à la projection de y sur l'image de X, ce qui est cohérent avec ce que nous avons vu dans la leçon sur la projection orthogonale.",
    "note": "Les équations normales nécessitent l'inversibilité de XᵀX."

  {
    "titre": "Résolution par Équations Normales",
    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;'><p style='margin: 0; font-weight: bold;'>🔧 Algorithme de résolution</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>Étapes :</strong></p><ol style='padding-left: 20px;'><li>Calculer <span style='font-style: italic;'>X<sup>T</sup>X</span></li><li>Calculer <span style='font-style: italic;'>X<sup>T</sup>y</span></li><li>Résoudre le système linéaire <span style='font-style: italic;'>X<sup>T</sup>X β = X<sup>T</sup>y</span></li></ol><p style='margin-top: 10px;'><strong>Complexité :</strong> <span style='font-style: italic;'>O(np² + p³)</span></p></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #e65100;'><p style='margin: 0;'><strong>⚠️ Attention :</strong> <span style='font-style: italic;'>X<sup>T</sup>X</span> peut être mal conditionné (problèmes numériques).</p></div></div>",
    "texteParle": "La résolution par les équations normales se fait en trois étapes. Premièrement, on calcule la matrice X transposée fois X. Deuxièmement, on calcule le vecteur X transposée fois y. Troisièmement, on résout le système linéaire X transposée fois X fois bêta égal X transposée fois y. La complexité de cette méthode est de l'ordre de n fois p au carré plus p au cube, ce qui peut être coûteux pour de grandes dimensions. Il faut aussi faire attention au conditionnement de la matrice X transposée fois X. Si cette matrice est mal conditionnée, la solution numérique peut être instable. C'est un problème fréquent en pratique, notamment lorsque les variables sont fortement corrélées.",

  {
    "titre": "Résolution par SVD",
    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;'><p style='margin: 0; font-weight: bold;'>🧮 La pseudo-inverse de Moore-Penrose</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>SVD de X :</strong></p><div style='text-align: center; font-size: 1.1rem; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( X = U \\Sigma V^T \\)</div><p><strong>Pseudo-inverse :</strong></p><div style='text-align: center; font-size: 1.2rem; font-weight: bold; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( X^+ = V \\Sigma^+ U^T \\)</div><p><strong>Solution :</strong></p><div style='text-align: center; font-size: 1.2rem; font-weight: bold; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( \\hat{\\beta} = X^+ y = V \\Sigma^+ U^T y \\)</div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #0d47a1;'><p style='margin: 0;'><strong>💡 Avantage :</strong> Fonctionne même si <span style='font-style: italic;'>X<sup>T</sup>X</span> n'est pas inversible.</p></div></div>",
    "texteParle": "La SVD offre une alternative plus robuste pour résoudre le problème des moindres carrés. On écrit la SVD de X comme U Sigma V transposée. La pseudo-inverse de Moore-Penrose, notée X plus, est donnée par V Sigma plus U transposée. La solution du problème des moindres carrés est alors bêta chapeau égal X plus fois y. L'avantage de cette approche est qu'elle fonctionne même si X transposée fois X n'est pas inversible, c'est-à-dire même si les colonnes de X ne sont pas linéairement indépendantes. C'est très utile en pratique, notamment lorsqu'on a plus de variables que d'observations, ce qui est fréquent en data science.",

    "texteParle": "Comparons maintenant les deux méthodes de résolution. Les équations normales sont plus rapides, avec une complexité de l'ordre de n fois p au carré. Cependant, elles nécessitent que X transposée fois X soit inversible, ce qui n'est pas toujours le cas. De plus, elles peuvent être instables numériquement si la matrice est mal conditionnée. La SVD, en revanche, est plus coûteuse en temps de calcul, mais elle fonctionne toujours, même si X n'est pas de plein rang. Elle est également plus stable numériquement et donne la solution de norme minimale lorsqu'il y a plusieurs solutions. En pratique, on choisit la méthode en fonction de la taille des données et du conditionnement du problème.",

  {
    "titre": "Application à la Régression Linéaire Multiple",
    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;'><p style='margin: 0; font-weight: bold;'>📊 Régression Linéaire Multiple</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>Modèle :</strong></p><div style='text-align: center; font-size: 1.1rem; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( y_i = \\beta_0 + \\beta_1 x_{i1} + ... + \\beta_p x_{ip} + \\varepsilon_i \\)</div><p>On cherche <span style='font-style: italic;'>β</span> qui minimise :</p><div style='text-align: center; font-size: 1.1rem; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( \\sum_{i=1}^n (y_i - \\beta_0 - \\beta_1 x_{i1} - ... - \\beta_p x_{ip})^2 \\)</div><p>La solution est : <span style='font-style: italic;'>\\hat{\\beta} = (X^T X)^{-1} X^T y</span></p></div></div>",
    "texteParle": "La régression linéaire multiple est l'application la plus directe des moindres carrés. Le modèle s'écrit y_i égal bêta zéro plus bêta un fois x_i1 plus ... plus bêta p fois x_ip plus epsilon_i. On cherche le vecteur bêta qui minimise la somme des carrés des résidus. La solution est donnée par la formule des équations normales que nous avons vue. Cette formule est implémentée dans tous les logiciels de statistique et de data science. En pratique, on utilise souvent la SVD pour calculer la solution, car elle est plus robuste et peut gérer les cas où la matrice X n'est pas de plein rang.",

    "texteParle": "La régularisation Ridge est une technique très utilisée pour améliorer la généralisation des modèles. Elle consiste à ajouter un terme de pénalité lambda fois la norme au carré de bêta à la fonction objectif. La nouvelle solution est bêta ridge égal X transposée fois X plus lambda fois l'identité inverse fois X transposée fois y. Le paramètre lambda contrôle l'importance de la régularisation. Plus lambda est grand, plus les coefficients sont réduits. L'effet de la régularisation Ridge est de réduire la variance des coefficients, ce qui permet d'éviter le sur-apprentissage. C'est particulièrement utile lorsque le nombre de variables est grand par rapport au nombre d'observations.",

  {

    "contenu": "<div style='font-size: 1.05rem; line-height: 1.8;'><div style='background: #1a237e; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;'><p style='margin: 0; font-weight: bold;'>⚡ Régularisation L1 (Lasso)</p></div><div style='background: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 4px solid #1a237e;'><p style='margin: 0;'><strong>Problème régularisé :</strong></p><div style='text-align: center; font-size: 1.1rem; padding: 10px; background: #f5f7fa; border-radius: 6px; margin: 8px 0;'>\\( \\min_{\\beta} \\|y - X\\beta\\|^2 + \\lambda \\|\\beta\\|_1 \\)</div><p><strong>Propriété :</strong> Effectue une sélection de variables (sparsité).</p><p>Les coefficients des variables non pertinentes sont mis à zéro.</p></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #0d47a1;'><p style='margin: 0;'><strong>💡 Comparaison :</strong> Ridge (L2) réduit les coefficients, Lasso (L1) les annule.</p></div></div>",
    "texteParle": "La régularisation Lasso est une autre technique de régularisation très populaire. Elle utilise une pénalité L1, c'est-à-dire la norme 1 de bêta, au lieu de la norme 2 pour Ridge. Le problème devient minimiser la norme de y moins X bêta au carré plus lambda fois la norme 1 de bêta. La particularité du Lasso est qu'il effectue une sélection de variables : les coefficients des variables non pertinentes sont mis à zéro. Cela permet d'obtenir un modèle plus simple et plus interprétable. En pratique, on utilise Lasso lorsqu'on pense que seules quelques variables sont réellement importantes. Le choix entre Ridge et Lasso dépend du contexte et des objectifs de l'analyse.",

    "texteParle": "Pour conclure cette leçon, retenons les points essentiels. Le problème des moindres carrés consiste à minimiser la norme de y moins X bêta au carré. La solution analytique est donnée par l'équation normale X transposée fois X fois bêta chapeau égal X transposée fois y. Si X n'est pas de plein rang, on utilise la pseudo-inverse obtenue par SVD. Enfin, pour éviter le sur-apprentissage, on utilise des techniques de régularisation : Ridge avec une pénalité L2 qui réduit les coefficients, et Lasso avec une pénalité L1 qui effectue une sélection de variables. Ces concepts sont au cœur de la data science moderne et vous les retrouverez dans de nombreux algorithmes. N'hésitez pas à les pratiquer sur des données réelles pour bien les maîtriser.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
