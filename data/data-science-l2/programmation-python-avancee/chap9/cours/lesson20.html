<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Bienvenue dans la Leçon 20 !",
        "contenu": "<div style='text-align: center; padding: 20px; background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%); border-radius: 15px;'><h2 style='color: #ffffff;'>Performance et Optimisation</h2><h3 style='color: #bee3f8;'>Profiling et Optimisation</h3><hr style='border: 1px solid #63b3ed; width: 50%;'><p style='font-size: 1.1em; color: #e2e8f0;'>Licence 2 Data Science - Université du Cameroun</p><p style='font-size: 1.1em; color: #e2e8f0;'>Enseignant : <strong style='color: #ffffff;'>Votre Nom</strong></p><div style='background: #2d3748; padding: 10px; border-radius: 10px; margin-top: 15px;'><p style='color: #e2e8f0;'>🎯 Objectif : Analyser et optimiser les performances des programmes Python</p></div></div>",
        "texteParle": "Bonjour à tous et bienvenue dans ce cours de Programmation Python Avancée. Nous sommes en Licence 2 Data Science. Aujourd'hui, nous allons aborder un sujet crucial pour tout développeur : le profiling et l'optimisation des performances. Dans le monde de la Data Science, où les volumes de données sont énormes, un code lent peut rendre vos analyses impossibles. Nous allons apprendre à identifier les goulots d'étranglement et à optimiser notre code.",
        "note": "Bienvenue dans la leçon sur le profiling et l'optimisation."
    },
    {
        "titre": "Pourquoi Optimiser son Code ?",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px; border-left: 5px solid #3182ce;'><p style='color: #2d3748;'><strong>Un code qui fonctionne n'est pas forcément un code efficace.</strong></p></div><ul style='color: #4a5568; font-size: 0.95em; margin-top: 10px; list-style-type: disc; padding-left: 20px;'><li><strong>Temps d'exécution :</strong> Un code lent ralentit le développement et l'analyse.</li><li><strong>Coût :</strong> En production, des ressources (CPU, mémoire) coûtent de l'argent.</li><li><strong>Scalabilité :</strong> Un code non optimisé ne passera pas à l'échelle sur de gros volumes de données.</li><li><strong>Expérience utilisateur :</strong> Des temps de réponse longs sont frustrants.</li></ul><div style='background: #fbd38d; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #744210; margin: 0;'><strong>💡 Règle d'or :</strong> \"Premier, faites-le fonctionner. Ensuite, faites-le bien. Puis, faites-le vite.\"</p></div>",
        "texteParle": "Pourquoi optimiser son code ? Dans le monde du Big Data et de la Data Science, chaque milliseconde compte. Un code lent peut transformer une analyse de 5 minutes en 5 heures, ou même faire planter votre programme sur des données volumineuses. De plus, en production, les ressources cloud ou serveurs ont un coût. Optimiser permet de réduire les coûts et d'améliorer l'expérience utilisateur. Mais attention, il ne faut pas optimiser trop tôt !",
        "note": "L'optimisation est essentielle pour la scalabilité et l'efficacité."
    },
    {
        "titre": "Le Profiling : Qu'est-ce que c'est ?",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Le profiling est l'art de mesurer les performances d'un programme.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔍 <strong>Identifier :</strong> Quelles parties du code sont les plus lentes ?</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>Mesurer :</strong> Combien de temps chaque fonction prend ?</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📈 <strong>Analyser :</strong> Combien de fois chaque fonction est appelée ?</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🎯 <strong>Cibler :</strong> Où concentrer les efforts d'optimisation ?</li></ul><div style='background: #bee3f8; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #2a4365; margin: 0;'><strong>📝 Note :</strong> Sans profiling, on optimise souvent au mauvais endroit (loi de Pareto : 80% du temps est passé dans 20% du code).</p></div>",
        "texteParle": "Le profiling, c'est comme un diagnostic médical pour votre code. Avant de traiter une maladie, il faut savoir où elle se trouve. De la même manière, avant d'optimiser, il faut savoir quelles parties de votre code sont les plus lentes. Le profiling vous donne des mesures précises : le temps passé dans chaque fonction, le nombre d'appels, etc. C'est essentiel pour ne pas optimiser au mauvais endroit.",
        "note": "Le profiling permet d'identifier les vrais goulots d'étranglement."
    },
    {
        "titre": "cProfile : L'outil de Profiling Standard",
        "contenu": "<div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>cProfile est le module de profiling intégré à Python.</strong></p></div><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>import cProfile<br>import pstats<br><br># Profiling d'une fonction<br>cProfile.run('ma_fonction()')<br><br># Profiling avec sauvegarde des résultats<br>cProfile.run('ma_fonction()', 'profile_output.prof')<br><br># Analyse des résultats<br>stats = pstats.Stats('profile_output.prof')<br>stats.sort_stats('cumtime').print_stats(10)</pre></div><ul style='color: #4a5568; margin-top: 10px;'><li><strong>cProfile.run() :</strong> Exécute et profile le code.</li><li><strong>pstats.Stats :</strong> Permet d'analyser et de trier les résultats.</li><li><strong>sort_stats() :</strong> Trie par temps cumulé, temps par appel, etc.</li></ul>",
        "texteParle": "Le module cProfile est l'outil de profiling standard de Python. Il est intégré et très facile à utiliser. Vous pouvez profiler une fonction avec cProfile.run() en lui passant le code à exécuter. Les résultats peuvent être sauvegardés dans un fichier, puis analysés avec le module pstats. Vous pouvez trier les résultats par temps cumulé, par temps par appel, ou par nombre d'appels. C'est très puissant.",
        "note": "cProfile est l'outil de profiling de référence en Python."
    },
    {
        "titre": "Analyse des Résultats de Profiling",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>Comprendre les métriques de profiling :</strong></p></div><ul style='color: #4a5568; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⏱️ <strong>ncalls :</strong> Nombre d'appels à la fonction.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⏱️ <strong>tottime :</strong> Temps total passé dans la fonction (hors sous-fonctions).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⏱️ <strong>cumtime :</strong> Temps cumulé (fonction + toutes ses sous-fonctions).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>percall (tottime/calls) :</strong> Temps moyen par appel.</li></ul><div style='background: #c6f6d5; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #22543d; margin: 0;'><strong>💡 Astuce :</strong> Les fonctions avec un <code>cumtime</code> élevé sont souvent les candidates à l'optimisation.</p></div>",
        "texteParle": "Lorsque vous analysez les résultats de profiling, vous verrez plusieurs métriques. 'ncalls' vous indique combien de fois une fonction a été appelée. 'tottime' est le temps passé dans la fonction elle-même, sans compter les appels à d'autres fonctions. 'cumtime' est le temps total, y compris les sous-fonctions. Si une fonction a un 'cumtime' élevé, c'est un bon candidat pour l'optimisation.",
        "note": "Comprendre les métriques est essentiel pour interpréter les résultats."
    },
    {
        "titre": "Identifier les Goulots d'Étranglement",
        "contenu": "<div style='background: #fed7d7; padding: 15px; border-radius: 10px;'><p style='color: #742a2a;'><strong>Les goulots d'étranglement sont les parties du code qui ralentissent tout.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔁 <strong>Boucles imbriquées :</strong> Complexité O(n²) ou plus.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📂 <strong>Accès I/O :</strong> Lecture/écriture de fichiers, accès réseau.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>💾 <strong>Allocations mémoire :</strong> Création d'objets en grande quantité.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🐍 <strong>Fonctions coûteuses :</strong> Certaines opérations Python sont lentes.</li></ul><div style='background: #fbd38d; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #744210; margin: 0;'><strong>🔍 Exemple :</strong> Une boucle <code>for</code> en Python est plus lente qu'une opération vectorisée avec NumPy.</p></div>",
        "texteParle": "Maintenant que vous savez profiler, il faut identifier les vrais goulots d'étranglement. Les boucles imbriquées sont souvent responsables de lenteurs. Les accès à des fichiers ou à des bases de données sont aussi des sources de ralentissement. La création d'objets en grande quantité peut saturer la mémoire. Il faut aussi connaître les opérations coûteuses en Python. Par exemple, une boucle Python pure est bien plus lente qu'une opération vectorisée avec NumPy.",
        "note": "Identifier le vrai problème est la clé d'une optimisation efficace."
    },
    {
        "titre": "Techniques d'Optimisation de Base",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Quelques techniques simples mais efficaces :</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📦 <strong>Liste en compréhension :</strong> Plus rapide que les boucles for simples.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📚 <strong>Éviter les attributs globaux :</strong> Accès aux variables locales plus rapide.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⚡ <strong>Utiliser les fonctions intégrées :</strong> map, filter, sum, etc. sont en C.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🧮 <strong>Bibliothèques vectorisées :</strong> NumPy, Pandas pour les opérations sur tableaux.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'># Lent<br>result = []<br>for i in range(1000000):<br>    result.append(i * 2)<br><br># Rapide (compréhension de liste)<br>result = [i * 2 for i in range(1000000)]</pre></div>",
        "texteParle": "Il existe des techniques d'optimisation simples mais très efficaces. Par exemple, les listes en compréhension sont plus rapides que les boucles for traditionnelles. Les variables locales sont plus rapides que les globales, donc il est préférable d'assigner des attributs globaux à des variables locales dans des fonctions. Les fonctions intégrées comme map, filter, sum, qui sont écrites en C, sont plus rapides que leurs équivalents en Python pur. Et si vous manipulez des tableaux, NumPy et Pandas sont vos meilleurs alliés.",
        "note": "Des techniques simples peuvent avoir un impact significatif sur les performances."
    },
    {
        "titre": "Optimisation des Boucles",
        "contenu": "<div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>Les boucles sont souvent les plus grandes sources de lenteur.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔄 <strong>Réduire le nombre d'itérations :</strong> Utiliser des algorithmes plus efficaces.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📦 <strong>Déplacer les calculs invariants :</strong> Sortir les calculs de la boucle.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔍 <strong>Éviter les accès répétés :</strong> Assigner les attributs à des variables locales.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'># Moins efficace<br>for i in range(len(liste)):<br>    result.append(liste[i] * 2)<br><br># Plus efficace (itération directe)<br>for val in liste:<br>    result.append(val * 2)<br><br># Encore plus efficace (compréhension)<br>result = [val * 2 for val in liste]</pre></div>",
        "texteParle": "Les boucles sont souvent responsables de la lenteur des programmes. Il faut donc les optimiser. D'abord, voyez si vous pouvez réduire le nombre d'itérations en utilisant un meilleur algorithme. Ensuite, sortez de la boucle tout calcul qui ne dépend pas de l'itération. Évitez les accès répétés à des attributs globaux en les assignant à des variables locales. Et n'oubliez pas les listes en compréhension, qui sont plus rapides.",
        "note": "Une boucle bien optimisée peut multiplier la vitesse par 10."
    },
    {
        "titre": "Utiliser les Bonnes Structures de Données",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>Choisir la bonne structure de données peut tout changer.</strong></p></div><ul style='color: #4a5568; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📋 <strong>List vs Set vs Dict :</strong> Choisir en fonction des opérations (recherche, insertion).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📦 <strong>array vs list :</strong> array est plus compact pour les nombres.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔄 <strong>deque vs list :</strong> deque est plus rapide pour les ajouts/suppressions aux extrémités.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'># Recherche dans une liste : O(n)<br>if element in ma_liste: ...<br><br># Recherche dans un ensemble : O(1)<br>if element in mon_set: ...</pre></div>",
        "texteParle": "Le choix de la structure de données est crucial pour la performance. Par exemple, une recherche dans une liste est en O(n), alors que dans un ensemble (set) ou un dictionnaire (dict), elle est en O(1). Si vous faites beaucoup de recherches, utilisez un set. Pour les nombres, le module 'array' est plus compact que les listes. Et si vous avez besoin d'ajouter ou de supprimer des éléments aux extrémités, utilisez 'deque' plutôt qu'une liste.",
        "note": "Une structure de données adaptée peut accélérer considérablement votre code."

    {
        "titre": "Optimisation avec NumPy",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>NumPy est indispensable pour les calculs numériques en Data Science.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🧮 <strong>Vectorisation :</strong> Opérations sur tout le tableau à la fois (en C).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>Broadcasting :</strong> Opérations entre tableaux de tailles différentes.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⚡ <strong>Ufuncs :</strong> Fonctions universelles optimisées.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>import numpy as np<br><br># Lent (Python pur)<br>a = [i for i in range(1000000)]<br>result = [x * 2 + 3 for x in a]<br><br># Rapide (NumPy vectorisé)<br>b = np.array(a)<br>result = b * 2 + 3</pre></div>",
        "texteParle": "En Data Science, vous allez souvent manipuler de grands tableaux de données. Dans ce cas, NumPy est votre meilleur ami. Les opérations vectorisées de NumPy sont écrites en C et sont bien plus rapides que des boucles Python. De plus, NumPy propose le broadcasting, qui permet d'effectuer des opérations entre des tableaux de tailles différentes. Les ufuncs (fonctions universelles) sont des opérations optimisées sur les tableaux.",
        "note": "NumPy est la clé de la performance en calcul numérique avec Python."
    },
    {
        "titre": "Optimisation avec Pandas",
        "contenu": "<div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>Pandas est l'outil de référence pour l'analyse de données tabulaires.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>apply() vs vectorisation :</strong> Préférer les opérations vectorisées à apply().</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>💾 <strong>Types de données :</strong> Utiliser des types appropriés (int8, float32).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔄 <strong>query() vs loc :</strong> query() est souvent plus rapide pour les filtres.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>import pandas as pd<br><br># Lent (apply avec lambda)<br>df['nouvelle'] = df['colonne'].apply(lambda x: x * 2)<br><br># Rapide (vectorisation)<br>df['nouvelle'] = df['colonne'] * 2</pre></div>",
        "texteParle": "Pandas est très puissant, mais il faut l'utiliser correctement pour éviter les lenteurs. La méthode 'apply' avec une fonction lambda est pratique, mais elle est souvent plus lente que les opérations vectorisées. Utilisez la vectorisation autant que possible. Faites attention aux types de données : utiliser des types plus compacts comme int8 ou float32 peut réduire la mémoire. Et pour filtrer, la méthode 'query' est souvent plus rapide que 'loc' avec des conditions complexes.",
        "note": "Pandas est puissant mais nécessite une utilisation avisée pour être performant."
    },
    {
        "titre": "Le Cache et la Mémoïsation",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>La mémoïsation consiste à stocker les résultats pour les réutiliser.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📦 <strong>lru_cache :</strong> Décorateur de functools pour la mémoïsation.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔄 <strong>Cache manuel :</strong> Utiliser un dictionnaire pour stocker les résultats.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⚡ <strong>Utilité :</strong> Éviter de recalculer plusieurs fois la même chose.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>from functools import lru_cache<br><br>@lru_cache(maxsize=128)<br>def fibonacci(n):<br>    if n < 2:<br>        return n<br>    return fibonacci(n-1) + fibonacci(n-2)</pre></div>",
        "texteParle": "La mémoïsation est une technique qui consiste à stocker les résultats des appels de fonctions pour les réutiliser. Cela évite de recalculer plusieurs fois la même chose. En Python, vous pouvez utiliser le décorateur 'lru_cache' du module functools. C'est particulièrement utile pour les fonctions récursives comme la suite de Fibonacci, ou pour des calculs lourds qui sont appelés avec les mêmes arguments.",
        "note": "La mémoïsation peut transformer un algorithme exponentiel en linéaire."
    },
    {
        "titre": "Éviter les Pièges Communs",
        "contenu": "<div style='background: #fed7d7; padding: 15px; border-radius: 10px;'><p style='color: #742a2a;'><strong>Certaines pratiques sont à éviter pour ne pas ralentir votre code.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🚫 <strong>Concaténation de chaînes en boucle :</strong> Utiliser <code>join</code>.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🚫 <strong>Accès inutiles à des attributs globaux :</strong> Les variables locales sont plus rapides.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🚫 <strong>Utilisation de <code>type()</code> au lieu de <code>isinstance()</code> :</strong> <code>isinstance</code> gère l'héritage.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🚫 <strong>Boucles Python pour de grandes opérations vectorielles :</strong> Utiliser NumPy.</li></ul>",
        "texteParle": "Il y a des pièges classiques à éviter. Par exemple, ne concaténez jamais des chaînes de caractères dans une boucle avec '+', utilisez 'join' qui est bien plus efficace. Les variables locales sont plus rapides que les globales, donc n'hésitez pas à assigner vos attributs globaux à des variables locales dans vos fonctions. Utilisez 'isinstance' au lieu de 'type' pour les vérifications de type. Et surtout, pour les opérations sur de grands ensembles de données, utilisez des bibliothèques vectorisées comme NumPy au lieu de boucles Python.",
        "note": "Éviter ces pièges peut grandement améliorer les performances."

    {
        "titre": "Outils d'Optimisation Avancés",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>Des outils pour aller plus loin :</strong></p></div><ul style='color: #4a5568; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>⚡ <strong>Numba :</strong> JIT compilation pour accélérer le code numérique.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>🔄 <strong>Cython :</strong> Compiler du code Python en code C.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>line_profiler :</strong> Profiling ligne par ligne.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>💾 <strong>memory_profiler :</strong> Profiling de la mémoire.</li></ul><div style='background: #bee3f8; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #2a4365; margin: 0;'><strong>📝 Note :</strong> Ces outils seront abordés dans les prochaines leçons.</p></div>",
        "texteParle": "Pour des optimisations plus avancées, il existe des outils comme Numba, qui compile votre code Python à la volée en code machine optimisé. Cython permet de compiler du code Python en code C. line_profiler vous permet de voir le temps passé sur chaque ligne de code. Et memory_profiler vous aide à identifier les fuites de mémoire. Ces outils sont plus avancés, mais ils seront abordés dans les prochaines leçons.",
        "note": "Des outils avancés existent pour les cas où les optimisations simples ne suffisent pas."

    {
        "titre": "Synthèse des Bonnes Pratiques",
        "contenu": "<div style='background: #e2e8f0; padding: 15px; border-radius: 10px;'><ul style='color: #2d3748; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 10px;'>✅ <strong>Règle n°1 :</strong> Profiler avant d'optimiser.</li><li style='margin-bottom: 10px;'>✅ <strong>Règle n°2 :</strong> Utiliser les bonnes structures de données.</li><li style='margin-bottom: 10px;'>✅ <strong>Règle n°3 :</strong> Préférer les opérations vectorisées (NumPy, Pandas).</li><li style='margin-bottom: 10px;'>✅ <strong>Règle n°4 :</strong> Éviter les boucles Python coûteuses.</li><li style='margin-bottom: 10px;'>✅ <strong>Règle n°5 :</strong> Utiliser la mémoïsation pour les calculs répétés.</li><li style='margin-bottom: 10px;'>✅ <strong>Règle n°6 :</strong> Écrire du code lisible d'abord, optimiser ensuite.</li></ul></div><div style='background: #3182ce; padding: 15px; border-radius: 8px; margin-top: 15px;'><p style='color: white; text-align: center; font-size: 1.1em;'>🚀 L'optimisation est un processus itératif : profiler, optimiser, re-profiler.</p></div>",
        "texteParle": "Pour résumer,;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
