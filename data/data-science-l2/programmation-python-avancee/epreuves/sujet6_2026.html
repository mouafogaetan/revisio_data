<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Programmation Python Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°6 - Gestion de Fichiers, Bases de Données, Tests et Performance",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Manipulation de fichiers JSON et CSV",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <p>L'Institut National de la Statistique du Cameroun vous fournit des données de recensement. Vous devez traiter ces données en utilisant les modules <code>json</code> et <code>csv</code>.</p>\n  <p>Le fichier <code>recensement.json</code> contient les données suivantes :</p>\n  <pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>[\n    {\"region\": \"Centre\", \"population\": 3500000, \"superficie\": 68900, \"densite\": 50.8},\n    {\"region\": \"Littoral\", \"population\": 4500000, \"superficie\": 20200, \"densite\": 222.8},\n    {\"region\": \"Ouest\", \"population\": 2500000, \"superficie\": 13900, \"densite\": 179.9}\n  ]</pre>\n  <p><strong>Questions :</strong></p>\n</div>",
      "questions": [
        {
          "question": "<div><strong>1. (1.5 pt)</strong> Écrire un script Python qui lit le fichier <code>recensement.json</code> en utilisant <code>json.load()</code> et affiche la population totale de toutes les régions.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import json\n\nwith open('recensement.json', 'r', encoding='utf-8') as f:\n    donnees = json.load(f)\n\npopulation_totale = sum(region['population'] for region in donnees)\nprint(f\"Population totale : {population_totale} habitants\")\n# Sortie : Population totale : 10500000 habitants</pre>"
        },
        {
          "question": "<div><strong>2. (1.5 pt)</strong> Ajouter une nouvelle région 'Extrême-Nord' avec une population de 4500000 habitants et une superficie de 34000 km². Sauvegarder les données mises à jour dans un fichier <code>recensement_maj.json</code>.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import json\n\nwith open('recensement.json', 'r', encoding='utf-8') as f:\n    donnees = json.load(f)\n\nnouvelle_region = {\n    \"region\": \"Extrême-Nord\",\n    \"population\": 4500000,\n    \"superficie\": 34000,\n    \"densite\": 132.4\n}\ndonnees.append(nouvelle_region)\n\nwith open('recensement_maj.json', 'w', encoding='utf-8') as f:\n    json.dump(donnees, f, indent=2, ensure_ascii=False)</pre>"
        },
        {
          "question": "<div><strong>3. (2 pts)</strong> Exporter les données du fichier JSON vers un fichier CSV nommé <code>recensement.csv</code> avec les colonnes : 'Region', 'Population', 'Superficie', 'Densite'. Utiliser <code>csv.DictWriter</code>.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import json\nimport csv\n\nwith open('recensement_maj.json', 'r', encoding='utf-8') as f:\n    donnees = json.load(f)\n\nwith open('recensement.csv', 'w', newline='', encoding='utf-8') as f:\n    champs = ['region', 'population', 'superficie', 'densite']\n    writer = csv.DictWriter(f, fieldnames=champs)\n    writer.writeheader()\n    for ligne in donnees:\n        writer.writerow(ligne)</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Gestion d'une base de données SQLite pour une école",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <p>Vous gérez la base de données d'une école au Cameroun. Vous devez créer et manipuler une base de données SQLite pour gérer les étudiants et leurs notes.</p>\n  <p><strong>Questions :</strong></p>\n</div>",
      "questions": [
        {
          "question": "<div><strong>1. (2 pts)</strong> Créer une base de données <code>ecole.db</code> avec deux tables :<br>- <code>etudiants</code> : <code>id</code> (clé primaire), <code>nom</code>, <code>prenom</code>, <code>classe</code><br>- <code>notes</code> : <code>id</code> (clé primaire), <code>etudiant_id</code> (clé étrangère), <code>matiere</code>, <code>note</code> (entre 0 et 20)</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import sqlite3\n\ndef creer_base():\n    conn = sqlite3.connect('ecole.db')\n    cur = conn.cursor()\n\n    cur.execute('''\n        CREATE TABLE IF NOT EXISTS etudiants (\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            nom TEXT NOT NULL,\n            prenom TEXT NOT NULL,\n            classe TEXT\n        )\n    ''')\n\n    cur.execute('''\n        CREATE TABLE IF NOT EXISTS notes (\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            etudiant_id INTEGER,\n            matiere TEXT NOT NULL,\n            note REAL CHECK(note >= 0 AND note <= 20),\n            FOREIGN KEY (etudiant_id) REFERENCES etudiants(id)\n        )\n    ''')\n\n    conn.commit()\n    conn.close()\n\ncreer_base()</pre>"
        },
        {
          "question": "<div><strong>2. (2 pts)</strong> Insérer trois étudiants et leurs notes respectives en utilisant des requêtes paramétrées pour éviter les injections SQL.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import sqlite3\n\ndef inserer_donnees():\n    conn = sqlite3.connect('ecole.db')\n    cur = conn.cursor()\n\n    etudiants = [\n        ('Tchoffo', 'Marie', 'L2 Data Science'),\n        ('Nganhou', 'Paul', 'L2 Data Science'),\n        ('Djoumessi', 'Jean', 'L2 Mathématiques')\n    ]\n\n    cur.executemany(\n        'INSERT INTO etudiants (nom, prenom, classe) VALUES (?, ?, ?)',\n        etudiants\n    )\n\n    notes = [\n        (1, 'Python', 15),\n        (1, 'SQL', 16),\n        (2, 'Python', 12),\n        (2, 'SQL', 10),\n        (3, 'Maths', 18)\n    ]\n\n    cur.executemany(\n        'INSERT INTO notes (etudiant_id, matiere, note) VALUES (?, ?, ?)',\n        notes\n    )\n\n    conn.commit()\n    conn.close()\n\ninserer_donnees()</pre>"
        },
        {
          "question": "<div><strong>3. (2 pts)</strong> Écrire une requête qui affiche pour chaque étudiant son nom, prénom et sa moyenne générale. Utiliser une requête SQL avec <code>JOIN</code> et <code>GROUP BY</code>.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import sqlite3\n\nconn = sqlite3.connect('ecole.db')\ncur = conn.cursor()\n\ncur.execute('''\n    SELECT e.nom, e.prenom, AVG(n.note) as moyenne\n    FROM etudiants e\n    JOIN notes n ON e.id = n.etudiant_id\n    GROUP BY e.id\n''')\n\nfor nom, prenom, moyenne in cur.fetchall():\n    print(f\"{prenom} {nom} : {moyenne:.2f}\")\n\nconn.close()</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Tests unitaires avec unittest",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <p>Vous avez développé une classe <code>GestionnaireNotes</code> pour gérer les notes des étudiants. Elle contient les méthodes suivantes :</p>\n  <pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>class GestionnaireNotes:\n    def __init__(self):\n        self.etudiants = {}\n\n    def ajouter_etudiant(self, nom, notes):\n        if not isinstance(notes, list):\n            raise TypeError(\"Les notes doivent être une liste\")\n        self.etudiants[nom] = notes\n\n    def moyenne(self, nom):\n        if nom not in self.etudiants:\n            raise ValueError(f\"Étudiant '{nom}' non trouvé\")\n        notes = self.etudiants[nom]\n        if not notes:\n            return 0\n        return sum(notes) / len(notes)</pre>\n  <p><strong>Questions :</strong></p>\n</div>",
      "questions": [
        {
          "question": "<div><strong>1. (3 pts)</strong> Écrire une classe de tests <code>TestGestionnaireNotes</code> héritant de <code>unittest.TestCase</code>. Tester :<br>- L'ajout d'un étudiant avec des notes valides.<br>- Le calcul de la moyenne.<br>- Le cas d'une liste de notes vide.<br>- La levée d'une exception pour un étudiant inexistant.<br>- La levée d'une exception pour un type de notes invalide.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import unittest\nfrom gestionnaire import GestionnaireNotes\n\nclass TestGestionnaireNotes(unittest.TestCase):\n\n    def setUp(self):\n        \"\"\"Fixture : création d'un gestionnaire avant chaque test.\"\"\"\n        self.g = GestionnaireNotes()\n        self.g.ajouter_etudiant(\"Alice\", [15, 16, 14])\n\n    def test_ajouter_etudiant(self):\n        self.assertIn(\"Alice\", self.g.etudiants)\n        self.assertEqual(self.g.etudiants[\"Alice\"], [15, 16, 14])\n\n    def test_moyenne(self):\n        self.assertEqual(self.g.moyenne(\"Alice\"), 15.0)\n\n    def test_moyenne_notes_vides(self):\n        self.g.ajouter_etudiant(\"Bob\", [])\n        self.assertEqual(self.g.moyenne(\"Bob\"), 0)\n\n    def test_etudiant_inexistant(self):\n        with self.assertRaises(ValueError):\n            self.g.moyenne(\"Inexistant\")\n\n    def test_notes_invalides(self):\n        with self.assertRaises(TypeError):\n            self.g.ajouter_etudiant(\"Charlie\", \"12,14,16\")\n\nif __name__ == '__main__':\n    unittest.main()</pre>"
        },
        {
          "question": "<div><strong>2. (2 pts)</strong> Convertir les tests précédents pour utiliser <code>pytest</code> avec <code>@pytest.mark.parametrize</code> pour la méthode <code>moyenne()</code>.</div>",
          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import pytest\nfrom gestionnaire import GestionnaireNotes\n\n@pytest.fixture\ndef gestionnaire():\n    g = GestionnaireNotes()\n    g.ajouter_etudiant(\"Alice\", [15, 16, 14])\n    return g\n\ndef test_ajouter_etudiant(gestionnaire):\n    assert \"Alice\" in gestionnaire.etudiants\n    assert gestionnaire.etudiants[\"Alice\"] == [15, 16, 14]\n\n@pytest.mark.parametrize(\"nom,notes,attendu\", [\n    (\"Alice\", [15, 16, 14], 15.0),\n    (\"Bob\", [], 0),\n])\ndef test_moyenne(gestionnaire, nom, notes, attendu):\n    if nom != \"Alice\":\n        gestionnaire.ajouter_etudiant(nom, notes)\n    assert gestionnaire.moyenne(nom) == attendu\n\ndef test_etudiant_inexistant(gestionnaire):\n    with pytest.raises(ValueError):\n        gestionnaire.moyenne(\"Inexistant\")\n\ndef test_notes_invalides(gestionnaire):\n    with pytest.raises(TypeError):\n        gestionnaire.ajouter_etudiant(\"Charlie\", \"12,14,16\")</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Profiling et optimisation de code (Bonus)",
      "points": "4 pts",

          "reponse": "<pre style='background:#f4f4f4;padding:10px;border-radius:5px;'>import timeit\n\ndef version1(donnees):\n    resultat = []\n    for x in donnees:\n        if x % 2 == 0:\n            resultat.append(x ** 2)\n    return sum(resultat)\n\ndef version2(donnees):\n    return sum(x**2 for x in donnees if x % 2 == 0)\n\ndef version3(donnees):\n    return sum(map(lambda x: x**2, filter(lambda x: x % 2 == 0, donnees)))\n\ndonnees = list(range(1000000))\n\nt1 = timeit.timeit(lambda: version1(donnees), number=10)\nt2 = timeit.timeit(lambda: version2(donnees), number=10)\nt3 = timeit.timeit(lambda: version3(donnees), number=10)\n\nprint(f\"Version boucle : {t1:.4f}s\")\nprint(f\"Version compréhension : {t2:.4f}s\")\nprint(f\"Version map/filter : {t3:.4f}s\")</pre>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
