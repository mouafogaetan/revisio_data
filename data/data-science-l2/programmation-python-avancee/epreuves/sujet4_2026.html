<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Programmation Python Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Programmation Orientée Objet (POO)",
      "points": "6 pts",
      "enonce": "<p>Dans le cadre de l'analyse de données de santé au Cameroun, vous devez modéliser un système de gestion de patients pour un hôpital. Chaque patient est caractérisé par un <strong>nom</strong>, un <strong>prénom</strong>, un <strong>numéro d'assurance maladie</strong>, un <strong>âge</strong> et un <strong>diagnostic</strong>.</p><p>L'hôpital souhaite organiser ses données en utilisant les concepts de la Programmation Orientée Objet. Pour cela, il vous est demandé de créer une classe <code>Patient</code> en respectant les consignes ci-dessous.</p>",
      "questions": [
        {
          "question": "<strong>1.1</strong> <span style='font-weight: bold;'>Définir</span> la classe <code>Patient</code> avec un constructeur <code>__init__</code> qui initialise les attributs d'instance (<em>nom</em>, <em>prénom</em>, <em>num_secu</em>, <em>age</em>, <em>diagnostic</em>). <span style='color: #555;'>(2 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>class Patient:\n    def __init__(self, nom, prenom, num_secu, age, diagnostic):\n        self.nom = nom\n        self.prenom = prenom\n        self.num_secu = num_secu\n        self.age = age\n        self.diagnostic = diagnostic</pre>"
        },
        {
          "question": "<strong>1.2</strong> <span style='font-weight: bold;'>Implémenter</span> la méthode spéciale <code>__str__</code> afin que l'affichage d'un objet <code>Patient</code> donne une chaîne formatée : <code>\"Patient : [Prénom] [Nom] - Âge : [age] ans - Diagnostic : [diagnostic]\"</code>. <span style='color: #555;'>(1 pt)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>def __str__(self):\n    return f\"Patient : {self.prenom} {self.nom} - Âge : {self.age} ans - Diagnostic : {self.diagnostic}\"</pre>"
        },
        {
          "question": "<strong>1.3</strong> <span style='font-weight: bold;'>Ajouter</span> un attribut de classe <code>nb_patients</code> qui s'incrémente à chaque instanciation d'un nouveau patient. <span style='color: #555;'>(1 pt)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>class Patient:\n    nb_patients = 0\n\n    def __init__(self, nom, prenom, num_secu, age, diagnostic):\n        self.nom = nom\n        self.prenom = prenom\n        self.num_secu = num_secu\n        self.age = age\n        self.diagnostic = diagnostic\n        Patient.nb_patients += 1</pre>"
        },
        {
          "question": "<strong>1.4</strong> <span style='font-weight: bold;'>Instancier</span> au moins deux patients et afficher leurs informations et le nombre total de patients. <span style='color: #555;'>(1 pt)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>p1 = Patient(\"Kouam\", \"Jean\", \"123456789\", 45, \"Hypertension\")\np2 = Patient(\"Ngono\", \"Marie\", \"987654321\", 30, \"Paludisme\")\n\nprint(p1)\nprint(p2)\nprint(f\"Nombre total de patients : {Patient.nb_patients}\")</pre>"
        },
        {
          "question": "<strong>1.5</strong> <span style='font-weight: bold;'>Créer</span> une classe <code>PatientAdulte</code> qui hérite de <code>Patient</code> et redéfinit la méthode <code>__str__</code> pour ajouter la mention <code>\"(Adulte)\"</code> à la fin. <span style='color: #555;'>(1 pt)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>class PatientAdulte(Patient):\n    def __str__(self):\n        return super().__str__() + \" (Adulte)\"</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Gestion des fichiers et Optimisation",
      "points": "5 pts",
      "enonce": "<p>Une entreprise de logistique basée à Douala souhaite analyser les données de ses livraisons. Les données sont stockées dans un fichier CSV intitulé <code>livraisons.csv</code> contenant les colonnes : <em>id_livraison, ville, poids, distance, delai</em>.</p><p>Le <strong>délai</strong> est exprimé en jours et la <strong>distance</strong> en kilomètres.</p>",
      "questions": [
        {
          "question": "<strong>2.1</strong> <span style='font-weight: bold;'>Écrire</span> une fonction <code>charger_donnees(nom_fichier)</code> qui lit le fichier CSV et retourne une liste de dictionnaires. <span style='color: #555;'>(1.5 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import csv\n\ndef charger_donnees(nom_fichier):\n    donnees = []\n    with open(nom_fichier, 'r', encoding='utf-8') as f:\n        reader = csv.DictReader(f)\n        for ligne in reader:\n            ligne['poids'] = float(ligne['poids'])\n            ligne['distance'] = float(ligne['distance'])\n            ligne['delai'] = int(ligne['delai'])\n            donnees.append(ligne)\n    return donnees</pre>"
        },
        {
          "question": "<strong>2.2</strong> <span style='font-weight: bold;'>Calculer</span> le délai moyen de livraison par ville. <span style='color: #555;'>(1 pt)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>def delai_moyen_par_ville(donnees):\n    villes = {}\n    for ligne in donnees:\n        ville = ligne['ville']\n        if ville not in villes:\n            villes[ville] = {'total': 0, 'nb': 0}\n        villes[ville]['total'] += ligne['delai']\n        villes[ville]['nb'] += 1\n    \n    resultats = {}\n    for ville, valeurs in villes.items():\n        resultats[ville] = valeurs['total'] / valeurs['nb']\n    return resultats</pre>"
        },
        {
          "question": "<strong>2.3</strong> <span style='font-weight: bold;'>Optimiser</span> la recherche du délai maximal. Utiliser une fonction <code>max_delai(donnees)</code> et <span style='font-weight: bold;'>décorer</span> cette fonction avec un décorateur qui mesure et affiche son temps d'exécution. <span style='color: #555;'>(2 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import time\nfrom functools import wraps\n\ndef mesure_temps(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        debut = time.time()\n        resultat = func(*args, **kwargs)\n        fin = time.time()\n        print(f\"{func.__name__} a pris {fin - debut:.4f} secondes\")\n        return resultat\n    return wrapper\n\n@mesure_temps\ndef max_delai(donnees):\n    return max(ligne['delai'] for ligne in donnees)</pre>"
        },
        {
          "question": "<strong>2.4</strong> <span style='font-weight: bold;'>Sérialiser</span> la liste des données dans un fichier binaire avec <code>pickle</code>. <span style='color: #555;'>(0.5 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import pickle\n\nwith open('livraisons.pkl', 'wb') as f:\n    pickle.dump(donnees, f)</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Pipelines de données et Tests",
      "points": "6 pts",
      "enonce": "<p>Vous développez une application de Data Science pour analyser les performances des étudiants d'une université camerounaise. Les données sont extraites d'une base de données SQLite.</p>",
      "questions": [
        {
          "question": "<strong>3.1</strong> <span style='font-weight: bold;'>Construire</span> un pipeline ETL simple qui :<br> - <span style='font-weight: bold;'>Extrait</span> les notes des étudiants depuis une table SQLite.<br> - <span style='font-weight: bold;'>Transforme</span> les données en calculant la moyenne des notes pour chaque étudiant.<br> - <span style='font-weight: bold;'>Charge</span> les résultats dans une nouvelle table <code>moyennes</code>. <span style='color: #555;'>(3 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import sqlite3\n\ndef pipeline_etl():\n    # Extraction\n    conn = sqlite3.connect('universite.db')\n    cursor = conn.cursor()\n    cursor.execute(\"SELECT etudiant_id, note FROM notes\")\n    notes = cursor.fetchall()\n    \n    # Transformation\n    moyennes = {}\n    for etudiant_id, note in notes:\n        if etudiant_id not in moyennes:\n            moyennes[etudiant_id] = {'total': 0, 'nb': 0}\n        moyennes[etudiant_id]['total'] += note\n        moyennes[etudiant_id]['nb'] += 1\n    \n    resultats = [(eid, d['total']/d['nb']) for eid, d in moyennes.items()]\n    \n    # Chargement\n    cursor.execute('''CREATE TABLE IF NOT EXISTS moyennes (\n                        etudiant_id INTEGER PRIMARY KEY,\n                        moyenne REAL)''')\n    cursor.executemany(\"INSERT OR REPLACE INTO moyennes VALUES (?, ?)\", resultats)\n    conn.commit()\n    conn.close()</pre>"
        },
        {
          "question": "<strong>3.2</strong> <span style='font-weight: bold;'>Écrire</span> un test unitaire avec <code>unittest</code> pour vérifier le calcul de la moyenne. <span style='color: #555;'>(1.5 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import unittest\n\nclass TestMoyenne(unittest.TestCase):\n    def test_calcul_moyenne(self):\n        notes = [(1, 12), (1, 15), (2, 10), (2, 8)]\n        moyennes = {}\n        for etudiant_id, note in notes:\n            if etudiant_id not in moyennes:\n                moyennes[etudiant_id] = {'total': 0, 'nb': 0}\n            moyennes[etudiant_id]['total'] += note\n            moyennes[etudiant_id]['nb'] += 1\n        self.assertEqual(moyennes[1]['total']/moyennes[1]['nb'], 13.5)\n        self.assertEqual(moyennes[2]['total']/moyennes[2]['nb'], 9.0)\n\nif __name__ == '__main__':\n    unittest.main()</pre>"
        },
        {
          "question": "<strong>3.3</strong> <span style='font-weight: bold;'>Utiliser</span> <code>pytest</code> pour paramétriser le test de la fonction de calcul de moyenne avec plusieurs cas de figure. <span style='color: #555;'>(1.5 pts)</span>",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace;'>import pytest\n\ndef calculer_moyenne(notes):\n    if not notes:\n        return 0\n    return sum(notes) / len(notes)\n\n@pytest.mark.parametrize(\"notes, attendu\", [\n    ([10, 12, 14], 12.0),\n    ([8, 9, 10, 11], 9.5),\n    ([], 0),\n    ([15], 15.0)\n])\ndef test_calculer_moyenne(notes, attendu):\n    assert calculer_moyenne(notes) == attendu</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Programmation Asynchrone et Optimisation",
      "points": "3 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
