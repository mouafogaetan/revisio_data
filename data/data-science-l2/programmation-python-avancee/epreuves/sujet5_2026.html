<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Programmation Python Avancée - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Épreuve séquentielle n°5 : Bases de Données, Tests, Debugging et Performance",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "1. SQLite et Gestion de Données",
     "points": "6 pts",
     "enonce": "<div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; color: #1a1a2e; margin-bottom: 15px;'><strong>Contexte :</strong> Vous développez une application de gestion de bibliothèque. Vous devez stocker les livres, les adhérents et les emprunts dans une base de données SQLite. L'application doit permettre d'ajouter, de modifier et de consulter ces données de manière efficace et sécurisée.</div><p>Vous allez concevoir la base de données, écrire des requêtes SQL, et gérer les transactions.</p>",
     "questions": [
       {
         "question": "<div style='font-weight: bold;'>1.1) Création de la base de données <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Écrire le code Python utilisant le module <code>sqlite3</code> pour créer une base de données nommée <code>bibliotheque.db</code> avec trois tables :</p><ul><li><code>livres</code> : id (INTEGER PRIMARY KEY), titre (TEXT), auteur (TEXT), annee (INTEGER)</li><li><code>adherents</code> : id (INTEGER PRIMARY KEY), nom (TEXT), prenom (TEXT), email (TEXT UNIQUE)</li><li><code>emprunts</code> : id (INTEGER PRIMARY KEY), id_livre (INTEGER), id_adherent (INTEGER), date_emprunt (DATE), date_retour (DATE), FOREIGN KEY (id_livre) REFERENCES livres(id), FOREIGN KEY (id_adherent) REFERENCES adherents(id)</li></ul>",
         "reponse": "<div style='background: #f8f9fa; padding: 12px; border-radius: 5px;'><code>import sqlite3<br><br>conn = sqlite3.connect('bibliotheque.db')<br>cursor = conn.cursor()<br><br>cursor.execute('''CREATE TABLE IF NOT EXISTS livres (<br>    id INTEGER PRIMARY KEY AUTOINCREMENT,<br>    titre TEXT NOT NULL,<br>    auteur TEXT NOT NULL,<br>    annee INTEGER<br>)''')<br><br>cursor.execute('''CREATE TABLE IF NOT EXISTS adherents (<br>    id INTEGER PRIMARY KEY AUTOINCREMENT,<br>    nom TEXT NOT NULL,<br>    prenom TEXT NOT NULL,<br>    email TEXT UNIQUE NOT NULL<br>)''')<br><br>cursor.execute('''CREATE TABLE IF NOT EXISTS emprunts (<br>    id INTEGER PRIMARY KEY AUTOINCREMENT,<br>    id_livre INTEGER,<br>    id_adherent INTEGER,<br>    date_emprunt DATE,<br>    date_retour DATE,<br>    FOREIGN KEY (id_livre) REFERENCES livres(id),<br>    FOREIGN KEY (id_adherent) REFERENCES adherents(id)<br>)''')<br><br>conn.commit()<br>conn.close()</code></div>"
       },
       {
         "question": "<div style='font-weight: bold;'>1.2) Requêtes paramétrées <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Écrire une fonction <code>ajouter_livre(titre, auteur, annee)</code> qui insère un livre dans la base de données en utilisant une requête paramétrée pour éviter les injections SQL. Écrire également une fonction <code>rechercher_livres_par_auteur(auteur)</code> qui retourne tous les livres d'un auteur donné.</p>",
         "reponse": "<div style='background: #f8f9fa; padding: 12px; border-radius: 5px;'><code>import sqlite3<br><br>def ajouter_livre(titre, auteur, annee):<br>    conn = sqlite3.connect('bibliotheque.db')<br>    cursor = conn.cursor()<br>    cursor.execute('''<br>        INSERT INTO livres (titre, auteur, annee)<br>        VALUES (?, ?, ?)<br>    ''', (titre, auteur, annee))<br>    conn.commit()<br>    conn.close()<br><br>def rechercher_livres_par_auteur(auteur):<br>    conn = sqlite3.connect('bibliotheque.db')<br>    cursor = conn.cursor()<br>    cursor.execute('''<br>        SELECT id, titre, annee FROM livres<br>        WHERE auteur = ?<br>    ''', (auteur,))<br>    resultats = cursor.fetchall()<br>    conn.close()<br>    return resultats</code></div><p>Les requêtes paramétrées utilisent des placeholders <code>?</code> et passent les valeurs dans un tuple séparément, ce qui empêche l'injection SQL en échappant correctement les caractères spéciaux.</p>"
       },
       {
         "question": "<div style='font-weight: bold;'>1.3) Transactions et gestion des erreurs <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Écrire une fonction <code>emprunter_livre(id_livre, id_adherent, date_emprunt)</code> qui effectue les opérations suivantes dans une transaction :</p><ul><li>Vérifier que le livre existe et n'est pas déjà emprunté (pas de date_retour NULL).</li><li>Insérer un nouvel emprunt.</li><li>Si une erreur survient, annuler toutes les modifications (ROLLBACK).</li></ul><p>Gérer l'exception si l'adhérent n'existe pas ou si le livre est déjà emprunté.</p>",
         "reponse": "<div style='background: #f8f9fa; padding: 12px; border-radius: 5px;'><code>import sqlite3<br><br>class LivreIndisponibleError(Exception):<br>    pass<br><br>class AdherentInconnuError(Exception):<br>    pass<br><br>def emprunter_livre(id_livre, id_adherent, date_emprunt):<br>    conn = sqlite3.connect('bibliotheque.db')<br>    cursor = conn.cursor()<br>    <br>    try:<br>        # Vérifier que l'adhérent existe<br>        cursor.execute('SELECT id FROM adherents WHERE id = ?', (id_adherent,))<br>        if not cursor.fetchone():<br>            raise AdherentInconnuError(f\"L'adhérent {id_adherent} n'existe pas.\")<br>        <br>        # Vérifier que le livre existe et n'est pas emprunté<br>        cursor.execute('''<br>            SELECT id FROM emprunts<br>            WHERE id_livre = ? AND date_retour IS NULL<br>        ''', (id_livre,))<br>        if cursor.fetchone():<br>            raise LivreIndisponibleError(f\"Le livre {id_livre} est déjà emprunté.\")<br>        <br>        # Insérer l'emprunt<br>        cursor.execute('''<br>            INSERT INTO emprunts (id_livre, id_adherent, date_emprunt)<br>            VALUES (?, ?, ?)<br>        ''', (id_livre, id_adherent, date_emprunt))<br>        <br>        conn.commit()<br>        print(\"Emprunt enregistré avec succès.\")<br>        <br>    except (LivreIndisponibleError, AdherentInconnuError) as e:<br>        conn.rollback()<br>        raise e<br>    except Exception as e:<br>        conn.rollback()<br>        raise Exception(f\"Erreur inattendue : {e}\")<br>    finally:<br>        conn.close()</code></div><p>L'utilisation de <code>try-except</code> avec <code>commit</code> et <code>rollback</code> assure l'atomicité de la transaction (propriété A de ACID).</p>"
       }
     ]
   },
   {
     "titre": "2. Tests Unitaires et Debugging",
     "points": "7 pts",
     "enonce": "<div style='background-color: #f0fff4; padding: 15px; border-radius: 8px; color: #1a1a2e; margin-bottom: 15px;'><strong>Contexte :</strong> Vous devez garantir la fiabilité de votre application de bibliothèque en écrivant des tests unitaires pour les fonctions développées, et en utilisant le débogueur pour corriger un bug.</div>",
     "questions": [
       {
         "question": "<div style='font-weight: bold;'>2.1) Tests avec unittest <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(3 pts)</span></div><p>Écrire une classe de test <code>TestBibliotheque</code> utilisant le module <code>unittest</code> pour tester la fonction <code>ajouter_livre()</code> et <code>rechercher_livres_par_auteur()</code>. Inclure :</p><ul><li>Un test d'insertion d'un livre et de vérification de sa présence.</li><li>Un test de recherche par auteur.</li><li>Un test de gestion des doublons d'email pour les adhérents.</li></ul>",
         "reponse": "<div style='background: #f8f9fa; padding: 12px; border-radius: 5px;'><code>import unittest<br>import sqlite3<br>from bibliotheque import ajouter_livre, rechercher_livres_par_auteur, ajouter_adherent<br><br>class TestBibliotheque(unittest.TestCase):<br>    <br>    def setUp(self):<br>        \"\"\"Créer une base de données de test avant chaque test.\"\"\"<br>        self.conn = sqlite3.connect(':memory:')  # Base en mémoire<br>        self.cursor = self.conn.cursor()<br>        # Créer les tables<br>        self.cursor.execute('CREATE TABLE livres (id INTEGER PRIMARY KEY AUTOINCREMENT, titre TEXT, auteur TEXT, annee INTEGER)')<br>        self.cursor.execute('CREATE TABLE adherents (id INTEGER PRIMARY KEY AUTOINCREMENT, nom TEXT, prenom TEXT, email TEXT UNIQUE)')<br>        self.conn.commit()<br>        <br>    def tearDown(self):<br>        self.conn.close()<br>    <br>    def test_ajouter_livre(self):<br>        ajouter_livre('Python pour les nuls', 'Jean Dupont', 2023, conn=self.conn)<br>        self.cursor.execute('SELECT * FROM livres WHERE titre = \"Python pour les nuls\"')<br>        resultat = self.cursor.fetchone()<br>        self.assertIsNotNone(resultat)<br>        self.assertEqual(resultat[2], 'Jean Dupont')<br>    <br>    def test_rechercher_par_auteur(self):<br>        ajouter_livre('Python pour les nuls', 'Jean Dupont', 2023, conn=self.conn)<br>        ajouter_livre('Data Science avec Python', 'Jean Dupont', 2024, conn=self.conn)<br>        resultats = rechercher_livres_par_auteur('Jean Dupont', conn=self.conn)<br>        self.assertEqual(len(resultats), 2)<br>    <br>    def test_email_unique(self):<br>        with self.assertRaises(sqlite3.IntegrityError):<br>            ajouter_adherent('Martin', 'Jean', 'jean@email.com', conn=self.conn)<br>            ajouter_adherent('Martin', 'Paul', 'jean@email.com', conn=self.conn)<br><br>if __name__ == '__main__':<br>    unittest.main()</code></div><p>Les méthodes <code>setUp()</code> et <code>tearDown()</code> permettent de préparer et nettoyer l'environnement de test, assurant l'isolation des tests.</p>"
       },

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
