<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>

        </div>

    <main class="slide-body" id="slideBody"></main>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>

                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>

                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Programmation Python Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Architecture d'une Application de Traitement de Données (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>Dans le cadre d'un projet de Data Science, vous devez concevoir l'architecture d'une application de traitement de données pour une entreprise de e-commerce. L'objectif est de traiter des données de ventes en temps réel, d'en extraire des indicateurs clés de performance (KPI), et de les stocker dans une base de données pour une analyse ultérieure.</p>\n\n  <h3>Partie 1 : Modélisation POO des Composants (6 pts)</h3>\n  <p>Pour une architecture robuste, vous devez modéliser les composants suivants en utilisant les concepts avancés de la Programmation Orientée Objet (POO) vus en cours :</p>\n\n  <ul>\n    <li><strong>DataStream :</strong> Une classe générique pour la lecture de flux de données (fichiers, API, bases de données). Elle doit être conçue comme une classe abstraite avec des méthodes comme <code>connect()</code> et <code>fetch()</code>.</li>\n    <li><strong>DataTransformer :</strong> Une classe pour appliquer des transformations aux données (nettoyage, agrégation, calcul de KPI). Elle doit utiliser le polymorphisme pour permettre différentes stratégies de transformation.</li>\n    <li><strong>DataLoader :</strong> Une classe pour charger les données transformées dans une base de données (par exemple, SQLite). Elle doit gérer les connexions et les transactions de manière robuste.</li>\n    <li><strong>DataPipeline :</strong> Une classe qui orchestre l'ensemble du pipeline en utilisant les composants ci-dessus.</li>\n  </ul>\n\n  <p>Répondez aux questions suivantes, en justifiant vos choix par des exemples concrets.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.1 (2 pts)</strong> Proposez une structure de classe abstraite pour <code>DataStream</code>. Expliquez pourquoi l'utilisation d'une classe abstraite est pertinente dans ce contexte.</div>",
          "reponse": "<div>Une classe abstraite <code>DataStream</code> peut être définie avec les méthodes abstraites <code>connect()</code> et <code>fetch()</code>, héritant de <code>ABC</code> [citation:9]. L'utilisation d'une classe abstraite est pertinente car elle définit un contrat (interface) que toutes les classes filles (ex: <code>FileStream</code>, <code>APIStream</code>) doivent implémenter. Cela assure une certaine cohérence et polymorphisme, permettant au reste du pipeline de fonctionner avec n'importe quel type de flux de données.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.2 (2 pts)</strong> Décrivez comment vous implémenteriez le polymorphisme dans la classe <code>DataTransformer</code>.</div>",
          "reponse": "<div>Le polymorphisme peut être implémenté en définissant une méthode commune, par exemple <code>transform(self, data)</code>, dans <code>DataTransformer</code> et en créant des sous-classes qui redéfinissent cette méthode selon des stratégies spécifiques (ex: <code>CleanTransformer</code>, <code>AggregateTransformer</code>, <code>KpiCalculator</code>). Le pipeline peut ainsi appeler <code>transformer.transform(data)</code> sans connaître le type exact de transformateur, ce qui facilite l'ajout de nouvelles transformations [citation:4][citation:9].</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.3 (2 pts)</strong> Expliquez comment vous géreriez les connexions à la base de données dans la classe <code>DataLoader</code> en utilisant un <em>context manager</em>.</div>",
          "reponse": "<div>La classe <code>DataLoader</code> peut utiliser un context manager (via <code>__enter__</code> et <code>__exit__</code>) pour gérer automatiquement l'ouverture et la fermeture des connexions, assurant ainsi la libération des ressources [citation:6]. Par exemple, on peut utiliser <code>with sqlite3.connect('db.sqlite') as conn:</code> pour s'assurer que la connexion est fermée même en cas d'erreur. Cela rend le code plus robuste et évite les fuites de connexion.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.4 (Bonus 2 pts)</strong> Proposez un exemple de décoration (décorateur) qui pourrait être utile pour l'ensemble du pipeline.</div>",
          "reponse": "<div>Un décorateur comme <code>@log_time</code> pourrait être utilisé pour mesurer et enregistrer le temps d'exécution des différentes étapes du pipeline (extraction, transformation, chargement). Défini comme <code>@log_time</code>, il permet d'ajouter facilement des logs de performance, ce qui est essentiel pour identifier les goulots d'étranglement [citation:1][citation:7].</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Implémentation d'un Générateur pour le Streaming de Données (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>L'entreprise de e-commerce reçoit des données de ventes en continu sous forme de flux. Pour une gestion efficace de la mémoire, vous devez implémenter un générateur Python qui lira et traitera ces données ligne par ligne à partir d'un fichier CSV volumineux.</p>\n  <p>Le fichier CSV contient les colonnes suivantes : <code>date</code>, <code>product_id</code>, <code>quantity</code>, <code>price</code>, <code>customer_id</code>.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.1 (2 pts)</strong> Écrivez une fonction générateur <code>read_sales_data(filename)</code> qui lit le fichier CSV et <code>yield</code> chaque ligne sous forme de dictionnaire, en évitant de charger tout le fichier en mémoire.</div>",
          "reponse": "<div>```python\nimport csv\n\ndef read_sales_data(filename):\n    with open(filename, mode='r', encoding='utf-8') as file:\n        reader = csv.DictReader(file)\n        for row in reader:\n            yield row\n```\nCe générateur lit le fichier ligne par ligne, ce qui est économe en mémoire, surtout pour les fichiers de grande taille [citation:4][citation:8].</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.2 (1.5 pts)</strong> En utilisant <code>yield from</code>, créez un deuxième générateur <code>filter_by_product(product_id, data_stream)</code> qui filtre les lignes pour un <code>product_id</code> spécifique.</div>",
          "reponse": "<div>```python\ndef filter_by_product(product_id, data_stream):\n    for record in data_stream:\n        if record['product_id'] == str(product_id):\n            yield record\n```\nNote : On peut aussi utiliser <code>yield from</code> si on déléguait la génération à un sous-générateur, mais ici une boucle simple avec condition est plus directe et efficace.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.3 (1.5 pts)</strong> Expliquez en quoi l'utilisation de générateurs est plus avantageuse qu'une approche classique pour traiter ce flux de données.</div>",
          "reponse": "<div>Les générateurs sont plus avantageux car ils permettent de traiter les données de manière paresseuse (<em>lazy</em>). Au lieu de charger l'intégralité du fichier en mémoire, ils produisent et traitent les éléments un par un. Cela est crucial pour des flux de données volumineux, car cela réduit l'empreinte mémoire et permet un traitement en temps réel (ou quasi-réel) des données au fur et à mesure de leur arrivée [citation:4][citation:8].</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Décorateurs et Logging (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>Pour améliorer la maintenabilité et le suivi du pipeline ETL, vous devez créer des décorateurs qui ajoutent des fonctionnalités de logging et de timing aux fonctions principales.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.1 (2 pts)</strong> Écrivez un décorateur <code>@log_execution</code> qui, lorsqu'il est appliqué à une fonction, affiche un message avant et après son exécution (ou en cas d'erreur).</div>",
          "reponse": "<div>```python\nimport functools\n\ndef log_execution(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        print(f\"Début de l'exécution de {func.__name__}\")\n        try:\n            result = func(*args, **kwargs)\n            print(f\"Fin de l'exécution de {func.__name__}\")\n            return result\n        except Exception as e:\n            print(f\"Erreur dans {func.__name__} : {e}\")\n            raise\n    return wrapper\n```\nL'utilisation de <code>functools.wraps</code> préserve les métadonnées de la fonction d'origine, ce qui est une bonne pratique [citation:1].</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.2 (1.5 pts)</strong> Écrivez un décorateur <code>@timer</code> qui mesure et affiche le temps d'exécution d'une fonction.</div>",
          "reponse": "<div>```python\nimport time\nimport functools\n\ndef timer(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        start_time = time.perf_counter()\n        result = func(*args, **kwargs)\n        end_time = time.perf_counter()\n        print(f\"{func.__name__} a pris {end_time - start_time:.4f} secondes\")\n        return result\n    return wrapper\n```\nCe décorateur est utile pour le profiling et l'optimisation des performances [citation:1].</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.3 (1.5 pts)</strong> Comment chaîneriez-vous les deux décorateurs sur une fonction <code>extract_data()</code> ?</div>",
          "reponse": "<div>On peut chaîner les décorateurs en les empilant :\n```python\n@log_execution\n@timer\ndef extract_data():\n    # Code d'extraction\n    pass\n```\nL'ordre d'exécution est du plus proche de la fonction vers le plus éloigné. Ici, <code>timer</code> sera exécuté puis <code>log_execution</code> englobera le résultat. On peut également définir des décorateurs paramétrés pour plus de flexibilité [citation:1].</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
