<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Programmation Python Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Programmation Orientée Objet Avancée",
      "points": "5 pts",
      "enonce": "<p>Dans le cadre d'une application de gestion d'une bibliothèque universitaire, vous devez modéliser le système de gestion des documents. Chaque document (livre, thèse, article) possède un identifiant, un titre, un auteur et une année de publication. Les livres ont un nombre de pages et un éditeur. Les thèses ont un directeur de thèse et une université. Les articles ont un nom de revue et un volume.</p><p>Vous devez implémenter les classes suivantes en Python en respectant les principes de la POO avancée.</p>",
      "questions": [
        {
          "question": "1) Définissez une classe abstraite <code>Document</code> avec les attributs et méthodes appropriés. Utilisez le module <code>abc</code>. Précisez les méthodes abstraites nécessaires.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>from abc import ABC, abstractmethod\n\nclass Document(ABC):\n    def __init__(self, identifiant, titre, auteur, annee):\n        self.identifiant = identifiant\n        self.titre = titre\n        self.auteur = auteur\n        self.annee = annee\n\n    @abstractmethod\n    def get_type(self):\n        pass\n\n    @abstractmethod\n    def afficher_infos(self):\n        pass</code></pre><p>La classe abstraite <code>Document</code> définit un contrat pour toutes les sous-classes. Les méthodes abstraites <code>get_type()</code> et <code>afficher_infos()</code> doivent être implémentées par chaque classe fille.</p>"
        },
        {
          "question": "2) Créez les classes <code>Livre</code>, <code>These</code> et <code>Article</code> qui héritent de <code>Document</code>. Utilisez <code>super()</code> pour appeler le constructeur parent. Ajoutez les attributs spécifiques à chaque type.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>class Livre(Document):\n    def __init__(self, identifiant, titre, auteur, annee, nb_pages, editeur):\n        super().__init__(identifiant, titre, auteur, annee)\n        self.nb_pages = nb_pages\n        self.editeur = editeur\n\n    def get_type(self):\n        return \"Livre\"\n\n    def afficher_infos(self):\n        return f\"Livre : {self.titre} de {self.auteur} ({self.annee}) - {self.nb_pages} pages, édité par {self.editeur}\"\n\nclass These(Document):\n    def __init__(self, identifiant, titre, auteur, annee, directeur, universite):\n        super().__init__(identifiant, titre, auteur, annee)\n        self.directeur = directeur\n        self.universite = universite\n\n    def get_type(self):\n        return \"Thèse\"\n\n    def afficher_infos(self):\n        return f\"Thèse : {self.titre} de {self.auteur} ({self.annee}) - Dirigée par {self.directeur}, Université {self.universite}\"\n\nclass Article(Document):\n    def __init__(self, identifiant, titre, auteur, annee, revue, volume):\n        super().__init__(identifiant, titre, auteur, annee)\n        self.revue = revue\n        self.volume = volume\n\n    def get_type(self):\n        return \"Article\"\n\n    def afficher_infos(self):\n        return f\"Article : {self.titre} de {self.auteur} ({self.annee}) - Publié dans {self.revue}, Volume {self.volume}\"</code></pre><p>Chaque classe fille appelle le constructeur parent avec <code>super()</code> et ajoute ses propres attributs. Les méthodes abstraites sont implémentées pour chaque type.</p>"
        },
        {
          "question": "3) Utilisez le polymorphisme pour créer une fonction <code>affichage_document(doc)</code> qui appelle la méthode <code>afficher_infos()</code> de n'importe quel document.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>def affichage_document(doc):\n    print(doc.afficher_infos())\n\n# Exemple d'utilisation\ndocs = [\n    Livre(\"L001\", \"Le Petit Prince\", \"Saint-Exupéry\", 1943, 96, \"Gallimard\"),\n    These(\"T001\", \"IA pour la data science\", \"Jean Dupont\", 2023, \"Dr. Martin\", \"UYI\"),\n    Article(\"A001\", \"Deep Learning avec Python\", \"Marie Kamga\", 2024, \"Nature AI\", 45)\n]\n\nfor doc in docs:\n    affichage_document(doc)</code></pre><p>Le polymorphisme permet d'utiliser la même fonction <code>affichage_document</code> pour tous les types de documents. C'est l'objet lui-même qui détermine quelle méthode <code>afficher_infos()</code> sera exécutée.</p>"
        }
      ]
    },
    {
      "titre": "Encapsulation et Gestion des Exceptions",
      "points": "4 pts",
      "enonce": "<p>Une application bancaire doit gérer des comptes. Vous devez implémenter une classe <code>CompteBancaire</code> avec les fonctionnalités suivantes :</p><ul><li>Numéro de compte (attribut privé).</li><li>Solde (attribut privé).</li><li>Nom du propriétaire.</li><li>Dépôt : permet d'ajouter de l'argent au compte.</li><li>Retrait : permet de retirer de l'argent si le solde est suffisant, sinon lève une exception.</li><li>Affichage du solde avec @property.</li></ul>",
      "questions": [
        {
          "question": "1) Implémentez la classe <code>CompteBancaire</code> avec les attributs privés <code>__numero</code> et <code>__solde</code>. Utilisez des conventions de nommage appropriées.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>class CompteBancaire:\n    def __init__(self, numero, nom_proprietaire, solde_initial=0):\n        self.__numero = numero\n        self.nom_proprietaire = nom_proprietaire\n        self.__solde = solde_initial\n\n    def deposer(self, montant):\n        if montant > 0:\n            self.__solde += montant\n        else:\n            raise ValueError(\"Le montant du dépôt doit être positif\")\n\n    def retirer(self, montant):\n        if montant > self.__solde:\n            raise ValueError(\"Solde insuffisant\")\n        if montant <= 0:\n            raise ValueError(\"Le montant du retrait doit être positif\")\n        self.__solde -= montant\n\n    @property\n    def solde(self):\n        return self.__solde\n\n    @property\n    def numero(self):\n        return self.__numero</code></pre><p>Les attributs <code>__numero</code> et <code>__solde</code> sont privés (name mangling). Le nom du propriétaire est public. Les méthodes <code>deposer</code> et <code>retirer</code> gèrent les opérations. Le solde est accessible en lecture seule via la propriété <code>@property</code>.</p>"
        },
        {
          "question": "2) Définissez une exception personnalisée <code>SoldeInsuffisantError</code> qui hérite de <code>Exception</code>. Utilisez-la dans la méthode <code>retirer</code>.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>class SoldeInsuffisantError(Exception):\n    def __init__(self, message=\"Solde insuffisant pour effectuer ce retrait\"):\n        self.message = message\n        super().__init__(self.message)\n\nclass CompteBancaire:\n    # ... (méthodes précédentes)\n\n    def retirer(self, montant):\n        if montant > self.__solde:\n            raise SoldeInsuffisantError(f\"Solde actuel : {self.__solde} FCFA, retrait demandé : {montant} FCFA\")\n        if montant <= 0:\n            raise ValueError(\"Le montant du retrait doit être positif\")\n        self.__solde -= montant</code></pre><p>L'exception personnalisée <code>SoldeInsuffisantError</code> permet de gérer spécifiquement ce cas d'erreur avec un message adapté.</p>"
        },
        {
          "question": "3) Créez une instance de la classe, effectuez un dépôt, un retrait, puis testez le cas où le retrait dépasse le solde avec un bloc <code>try-except</code>.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code># Test de la classe\ncompte = CompteBancaire(\"CAM001\", \"Alice Ngan\", 100000)\nprint(f\"Solde initial : {compte.solde} FCFA\")\n\ncompte.deposer(50000)\nprint(f\"Après dépôt : {compte.solde} FCFA\")\n\ntry:\n    compte.retirer(200000)\n    print(f\"Après retrait : {compte.solde} FCFA\")\nexcept SoldeInsuffisantError as e:\n    print(f\"Erreur : {e}\")\nexcept ValueError as e:\n    print(f\"Erreur de validation : {e}\")</code></pre><p>Ce code teste les fonctionnalités de la classe et gère correctement les exceptions avec un bloc <code>try-except</code>.</p>"
        }
      ]
    },
    {
      "titre": "Générateurs et Itérateurs",
      "points": "4 pts",
      "enonce": "<p>Vous devez traiter un très grand fichier de données (plusieurs Go) contenant des relevés de capteurs. Chaque ligne du fichier a le format : <code>timestamp;capteur;valeur</code>. Vous ne pouvez pas charger tout le fichier en mémoire.</p><p>Les données doivent être nettoyées : les valeurs aberrantes (valeur > 100) sont ignorées. Vous devez calculer la moyenne des valeurs pour chaque capteur.</p>",
      "questions": [
        {
          "question": "1) Écrivez une fonction générateur <code>lire_fichier(nom_fichier)</code> qui lit le fichier ligne par ligne et <code>yield</code> un dictionnaire pour chaque ligne valide. Gérez les lignes mal formatées.",
          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>def lire_fichier(nom_fichier):\n    try:\n        with open(nom_fichier, 'r', encoding='utf-8') as fichier:\n            for ligne in fichier:\n                ligne = ligne.strip()\n                if not ligne:\n                    continue\n                try:\n                    timestamp, capteur, valeur = ligne.split(';')\n                    valeur = float(valeur)\n                    # Filtrer les valeurs aberrantes\n                    if valeur > 100:\n                        continue\n                    yield {\n                        'timestamp': timestamp,\n                        'capteur': capteur,\n                        'valeur': valeur\n                    }\n                except ValueError:\n                    # Ignorer les lignes mal formatées\n                    continue\n    except FileNotFoundError:\n        raise FileNotFoundError(f\"Le fichier {nom_fichier} n'existe pas\")</code></pre><p>Ce générateur lit le fichier ligne par ligne, filtre les valeurs aberrantes et ignore les lignes mal formatées. La mémoire utilisée est constante, quelle que soit la taille du fichier.</p>"
        },
        {
          "question": "2) Écrivez une fonction <code>moyenne_par_capteur(gen)</code> qui reçoit un générateur en entrée et retourne un dictionnaire contenant la moyenne des valeurs pour chaque capteur.",

          "reponse": "<pre style='background-color:#f0f0f0; padding:15px; border-radius:8px; overflow-x:auto; white-space: pre-wrap; word-wrap: break-word; color:#333;'><code>import time\nfrom functools import wraps\n\ndef timer(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        debut = time.time()\n        resultat = func(*args, **kwargs)\n        fin = time.time()\n        print(f\"{func.__name__} a pris {fin - debut:.4f} secondes\")\n        return resultat\n    return wrapper\n\n# Exemple d'utilisation\n@timer\ndef calcul_lourd():\n    time.sleep(1)\n    return sum(range(1000000))\n\nprint(calcul_lourd())</code></pre><p>Le décorateur <code>@timer</code> mesure et affiche le temps d'exécution de la fonction décorée. <code>@wraps</code> préserve le nom et la docstring de la fonction originale.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
