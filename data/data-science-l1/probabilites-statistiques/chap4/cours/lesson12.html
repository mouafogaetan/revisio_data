<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {

        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;

            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }

            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;

    }

    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;

    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {

    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;

    }

<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>

            </button>

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>

                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>

                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'Estimation",
    "contenu": "<div style='font-size:1.1rem; line-height:1.8;'><p><strong>Objectif de la leçon :</strong></p><ul style='list-style-type:disc; padding-left:20px;'><li>Comprendre ce qu'est un <strong>estimateur</strong> et une <strong>estimation</strong>.</li><li>Apprendre à estimer les paramètres d'une population à partir d'un échantillon.</li><li>Maîtriser les propriétés fondamentales d'un bon estimateur.</li></ul><div style='background:#e8f4f8; padding:15px; border-radius:10px; margin-top:15px;'><p style='margin:0;'><strong>Exemple concret :</strong> Au Cameroun, pour estimer le salaire moyen des data scientists à Douala, on interroge 50 professionnels (échantillon) au lieu de toute la population.</p></div></div>",
    "texteParle": "Bonjour à tous. Bienvenue dans cette leçon sur l'estimation ponctuelle. Aujourd'hui, nous allons apprendre comment utiliser un échantillon pour estimer des caractéristiques d'une population entière. C'est un outil fondamental en Data Science, car il est souvent impossible d'étudier toute une population. Nous verrons les notions d'estimateur, d'estimation et les propriétés qui font qu'un estimateur est de bonne qualité.",
    "note": "L'estimation ponctuelle est la base de la statistique inférentielle."
  },
  {
    "titre": "Population vs Échantillon",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='display:flex; flex-wrap:wrap; gap:15px;'><div style='flex:1; min-width:200px; background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Population</h3><p>Ensemble complet des individus ou objets d'intérêt.</p><p><strong>Exemple :</strong> Tous les étudiants de la Licence 1 Data Science au Cameroun.</p></div><div style='flex:1; min-width:200px; background:#16a085; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Échantillon</h3><p>Sous-ensemble représentatif de la population.</p><p><strong>Exemple :</strong> 30 étudiants choisis aléatoirement dans cette classe.</p></div></div><div style='margin-top:15px; background:#ecf0f1; padding:15px; border-radius:10px;'><p style='margin:0;'><strong>Paramètre</strong> : valeur numérique décrivant une caractéristique de la <strong>population</strong> (ex: moyenne, proportion).<br><strong>Statistique</strong> : valeur numérique calculée à partir de l'<strong>échantillon</strong> pour estimer le paramètre.</p></div></div>",
    "texteParle": "Pour bien comprendre l'estimation, il faut d'abord distinguer la population et l'échantillon. La population, c'est l'ensemble de tous les individus qui nous intéressent. L'échantillon, c'est un sous-ensemble de cette population que nous allons étudier. En Data Science, on travaille presque toujours avec des échantillons parce que c'est moins coûteux et plus rapide. Les paramètres sont des valeurs qui décrivent la population, tandis que les statistiques sont des valeurs calculées à partir de l'échantillon.",
    "note": "Un bon échantillon doit être représentatif de la population."
  },
  {
    "titre": "Estimateur vs Estimation",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px; margin-bottom:15px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimateur</h3><p style='color:white;'>C'est une <strong>formule mathématique</strong> ou une <strong>fonction</strong> des données de l'échantillon.</p><p style='color:white;'>Elle est notée avec un <strong>chapeau</strong> : <span style='color:#f1c40f;'>\\( \\hat{\\theta} \\)</span></p><p style='color:white;'>Elle est définie <strong>avant</strong> de voir les données.</p></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimation</h3><p style='color:white;'>C'est la <strong>valeur numérique</strong> obtenue en appliquant l'estimateur à un échantillon spécifique.</p><p style='color:white;'>Exemple : si \\( \\hat{\\mu} = \\bar{X} \\), alors pour un échantillon donné, on calcule \\( \\bar{x} = 25000 \\).</p><p style='color:white;'>Elle est calculée <strong>après</strong> avoir observé les données.</p></div></div>",
    "texteParle": "Il est très important de faire la différence entre un estimateur et une estimation. L'estimateur, c'est la formule que l'on va utiliser pour estimer un paramètre. C'est une fonction des données de l'échantillon. L'estimation, c'est le résultat numérique que l'on obtient quand on applique cette formule à un échantillon concret. Par exemple, la moyenne de l'échantillon est un estimateur de la moyenne de la population. Quand on calcule cette moyenne avec des données réelles, on obtient une estimation.",
    "note": "Un estimateur est une variable aléatoire, une estimation est une valeur fixe."
  },
  {
    "titre": "Les Estimateurs Usuels",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><table style='width:100%; border-collapse:collapse; font-size:0.95rem;'><thead><tr style='background:#2c3e50; color:white;'><th style='padding:10px; border:1px solid #ddd;'>Paramètre</th><th style='padding:10px; border:1px solid #ddd;'>Estimateur</th><th style='padding:10px; border:1px solid #ddd;'>Formule</th></tr></thead><tbody><tr style='background:#f9f9f9;'><td style='padding:10px; border:1px solid #ddd;'>Moyenne \\( \\mu \\)</td><td style='padding:10px; border:1px solid #ddd;'>Moyenne empirique \\( \\bar{X} \\)</td><td style='padding:10px; border:1px solid #ddd;'>\\( \\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} X_i \\)</td></tr><tr style='background:#fff;'><td style='padding:10px; border:1px solid #ddd;'>Variance \\( \\sigma^2 \\)</td><td style='padding:10px; border:1px solid #ddd;'>Variance empirique \\( S^2 \\)</td><td style='padding:10px; border:1px solid #ddd;'>\\( S^2 = \\frac{1}{n} \\sum_{i=1}^{n} (X_i - \\bar{X})^2 \\)</td></tr><tr style='background:#f9f9f9;'><td style='padding:10px; border:1px solid #ddd;'>Proportion \\( p \\)</td><td style='padding:10px; border:1px solid #ddd;'>Proportion empirique \\( \\hat{p} \\)</td><td style='padding:10px; border:1px solid #ddd;'>\\( \\hat{p} = \\frac{1}{n} \\sum_{i=1}^{n} \\mathbf{1}_{\\{X_i = 1\\}} \\)</td></tr></tbody></table><div style='background:#e8f4f8; padding:12px; border-radius:8px; margin-top:12px;'><p style='margin:0;'><strong>À retenir :</strong> Ces estimateurs sont les plus utilisés en Data Science. Ils sont simples à calculer et possèdent de bonnes propriétés.</p></div></div>",
    "texteParle": "Voyons maintenant les estimateurs les plus utilisés en statistique. Pour estimer la moyenne d'une population, on utilise la moyenne de l'échantillon. Pour estimer la variance, on utilise la variance de l'échantillon. Et pour estimer une proportion, on utilise la proportion observée dans l'échantillon. Ces trois estimateurs sont les piliers de l'estimation ponctuelle et vous les utiliserez très souvent dans vos projets en Data Science.",
    "note": "La moyenne empirique \\( \\bar{X} \\) est un estimateur de la moyenne \\( \\mu \\) de la population."
  },
  {
    "titre": "Propriétés d'un Bon Estimateur : Biais",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Biais d'un estimateur</h3><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ \\text{Biais}(\\hat{\\theta}) = E(\\hat{\\theta}) - \\theta $$</div></div><p style='color:white;'><strong>Estimateur sans biais :</strong> \\( E(\\hat{\\theta}) = \\theta \\)</p><p style='color:white;'><strong>Estimateur biaisé :</strong> \\( E(\\hat{\\theta}) \\neq \\theta \\)</p></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px; margin-top:15px;'><h3 style='margin-top:0; color:#f1c40f;'>Exemple au Cameroun</h3><p style='color:white;'>Si on estime le salaire moyen à Douala et qu'en moyenne, sur 100 échantillons, notre estimation est toujours supérieure au vrai salaire moyen, alors notre estimateur est biaisé.</p></div></div>",
    "texteParle": "Un bon estimateur doit être sans biais. Qu'est-ce que cela signifie ? Cela veut dire que si l'on prend beaucoup d'échantillons différents et que l'on calcule à chaque fois notre estimation, la moyenne de toutes ces estimations doit être égale au vrai paramètre de la population. Le biais est la différence entre l'espérance de l'estimateur et le vrai paramètre. Un estimateur sans biais est un estimateur qui ne surestime ni ne sous-estime systématiquement le paramètre qu'il cherche à estimer.",
    "note": "La moyenne empirique \\( \\bar{X} \\) est un estimateur sans biais de \\( \\mu \\)."
  },
  {
    "titre": "Propriétés d'un Bon Estimateur : Convergence",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Convergence (ou Consistance)</h3><p style='color:white;'>Un estimateur est <strong>convergent</strong> si, lorsque la taille de l'échantillon \\( n \\) augmente, l'estimateur se rapproche de plus en plus du vrai paramètre.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ \\hat{\\theta}_n \\xrightarrow[n \\to \\infty]{} \\theta $$</div></div></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px; margin-top:15px;'><h3 style='margin-top:0; color:#f1c40f;'>Exemple</h3><p style='color:white;'>Si on interroge 1000 personnes au lieu de 50, notre estimation du salaire moyen sera plus proche de la vérité. Plus l'échantillon est grand, plus l'estimation est précise.</p></div></div>",
    "texteParle": "Un bon estimateur doit aussi être convergent, c'est-à-dire que plus on augmente la taille de l'échantillon, plus l'estimation se rapproche du vrai paramètre. En d'autres termes, quand l'échantillon devient très grand, l'erreur d'estimation tend vers zéro. C'est une propriété essentielle en Data Science, car elle nous garantit qu'en collectant plus de données, nos estimations deviendront de plus en plus fiables.",
    "note": "La convergence garantit que l'erreur d'estimation diminue avec la taille de l'échantillon."
  },
  {
    "titre": "Propriétés d'un Bon Estimateur : Efficacité",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Efficacité (ou Variance Minimale)</h3><p style='color:white;'>Un estimateur est <strong>efficace</strong> s'il a la plus petite variance parmi tous les estimateurs sans biais.</p><p style='color:white;'>Un bon estimateur doit avoir une <strong>variance faible</strong>.</p></div><div style='display:flex; flex-wrap:wrap; gap:15px; margin-top:15px;'><div style='flex:1; min-width:200px; background:#e74c3c; color:white; padding:15px; border-radius:10px;'><h4 style='margin-top:0; color:#f1c40f;'>Estimateur peu efficace</h4><p style='color:white;'>Grande variance → résultats très dispersés</p></div><div style='flex:1; min-width:200px; background:#27ae60; color:white; padding:15px; border-radius:10px;'><h4 style='margin-top:0; color:#f1c40f;'>Estimateur très efficace</h4><p style='color:white;'>Petite variance → résultats stables</p></div></div></div>",
    "texteParle": "L'efficacité mesure la précision d'un estimateur. Un estimateur efficace est un estimateur qui a la plus petite variance possible parmi tous les estimateurs sans biais. En d'autres termes, il donne des estimations qui sont le moins dispersées possible autour de la vraie valeur. Une petite variance signifie que l'estimateur est stable et que les résultats sont fiables. Imaginez que vous tiriez une cible : un estimateur efficace est comme un tireur qui met toujours ses flèches très près du centre.",
    "note": "La variance d'un estimateur mesure sa précision. Plus elle est faible, meilleur est l'estimateur."
  },
  {
    "titre": "La Méthode du Maximum de Vraisemblance (MLE)",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Principe du MLE</h3><p style='color:white;'>La méthode du maximum de vraisemblance consiste à choisir le paramètre <span style='color:#f1c40f;'>\\( \\theta \\)</span> qui <strong>maximise</strong> la probabilité d'observer les données que nous avons.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ \\hat{\\theta}_{MLE} = \\arg\\max_{\\theta} L(\\theta | \\text{données}) $$</div></div></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px; margin-top:15px;'><h4 style='margin-top:0; color:#f1c40f;'>Exemple</h4><p style='color:white;'>Si on lance une pièce 10 fois et qu'on obtient 7 faces, le MLE de \\( p \\) (probabilité de face) est \\( \\hat{p} = 0.7 \\). C'est le paramètre qui rend nos observations les plus probables.</p></div></div>",
    "texteParle": "La méthode du maximum de vraisemblance, ou MLE, est l'une des méthodes les plus importantes pour estimer des paramètres. Le principe est simple : nous choisissons le paramètre qui rend nos données observées les plus probables. Par exemple, si nous avons observé 7 faces sur 10 lancers, la probabilité de face qui rend cette observation la plus probable est 0,7. Cette méthode est très utilisée en Data Science parce qu'elle a d'excellentes propriétés et qu'elle fonctionne pour presque tous les modèles.",
    "note": "Le MLE est une méthode puissante qui donne des estimateurs avec de bonnes propriétés."
  },
  {
    "titre": "MLE pour la Loi de Bernoulli",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimation du paramètre \\( p \\) de la loi de Bernoulli</h3><p style='color:white;'>Soit \\( X_1, X_2, ..., X_n \\sim \\mathcal{B}(p) \\) des épreuves de Bernoulli indépendantes.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ L(p) = \\prod_{i=1}^{n} p^{X_i} (1-p)^{1-X_i} $$</div></div><div class='math-block' style='text-align:center; padding:10px; background:#27ae60; border-radius:8px; margin:10px 0;'><div class='math' style='color:white; font-size:1.2rem;'>$$ \\hat{p}_{MLE} = \\frac{1}{n} \\sum_{i=1}^{n} X_i = \\bar{X} $$</div></div><p style='color:white;'>On retrouve la moyenne empirique !</p></div></div>",
    "texteParle": "Voyons maintenant comment appliquer la méthode du maximum de vraisemblance pour estimer la probabilité de succès d'une loi de Bernoulli. La vraisemblance est le produit des probabilités de chaque observation. En maximisant cette vraisemblance par rapport à p, on obtient que l'estimateur du maximum de vraisemblance de p est simplement la moyenne des observations, c'est-à-dire la proportion de succès observée dans l'échantillon. C'est un résultat très intuitif et rassurant.",
    "note": "Pour la loi de Bernoulli, l'estimateur du MLE est la moyenne empirique \\( \\bar{X} \\)."
  },
  {
    "titre": "MLE pour la Loi Binomiale",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimation du paramètre \\( p \\) de la loi binomiale</h3><p style='color:white;'>Soit \\( X \\sim \\mathcal{B}(n, p) \\) une variable aléatoire binomiale.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ P(X = k) = \\binom{n}{k} p^k (1-p)^{n-k} $$</div></div><div class='math-block' style='text-align:center; padding:10px; background:#27ae60; border-radius:8px; margin:10px 0;'><div class='math' style='color:white; font-size:1.2rem;'>$$ \\hat{p}_{MLE} = \\frac{X}{n} $$</div></div><p style='color:white;'>C'est la proportion de succès observée !</p></div></div>",
    "texteParle": "Pour la loi binomiale, l'estimation du paramètre p se fait de la même manière que pour la loi de Bernoulli. On observe une variable aléatoire qui suit une loi binomiale, qui représente le nombre de succès sur n épreuves. L'estimateur du maximum de vraisemblance de p est le nombre de succès divisé par le nombre total d'épreuves. C'est encore une fois un résultat très intuitif : la proportion de succès dans l'échantillon est la meilleure estimation de la probabilité de succès.",
    "note": "Pour une loi binomiale \\( \\mathcal{B}(n,p) \\), \\( \\hat{p}_{MLE} = X/n \\) est un estimateur sans biais."
  },
  {
    "titre": "MLE pour la Loi de Poisson",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimation du paramètre \\( \\lambda \\) de la loi de Poisson</h3><p style='color:white;'>Soit \\( X \\sim \\mathcal{P}(\\lambda) \\) une variable aléatoire de Poisson.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ P(X = k) = \\frac{e^{-\\lambda} \\lambda^k}{k!} $$</div></div><div class='math-block' style='text-align:center; padding:10px; background:#27ae60; border-radius:8px; margin:10px 0;'><div class='math' style='color:white; font-size:1.2rem;'>$$ \\hat{\\lambda}_{MLE} = \\bar{X} $$</div></div><p style='color:white;'>L'estimateur est la moyenne empirique !</p></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px; margin-top:15px;'><p style='color:white; margin:0;'><strong>Exemple :</strong> Pour estimer le nombre moyen d'accidents par jour à un carrefour à Yaoundé, on prend la moyenne des accidents observés sur plusieurs jours.</p></div></div>",
    "texteParle": "Pour la loi de Poisson, qui modélise souvent le nombre d'événements rares dans un intervalle de temps, l'estimateur du maximum de vraisemblance du paramètre lambda est simplement la moyenne empirique. Cela signifie que pour estimer le nombre moyen d'événements, on calcule la moyenne du nombre d'événements observés dans nos échantillons. Par exemple, si on veut estimer le nombre moyen de pannes de serveur par mois à une entreprise, on prend la moyenne des pannes observées sur les derniers mois.",
    "note": "Pour la loi de Poisson, \\( \\hat{\\lambda}_{MLE} = \\bar{X} \\) est l'estimateur du MLE."
  },
  {
    "titre": "MLE pour la Loi Normale",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Estimation des paramètres de la loi normale</h3><p style='color:white;'>Soit \\( X_1, ..., X_n \\sim \\mathcal{N}(\\mu, \\sigma^2) \\) indépendantes.</p><div style='display:flex; flex-wrap:wrap; gap:15px; margin:10px 0;'><div style='flex:1; min-width:150px; background:#34495e; padding:12px; border-radius:8px;'><p style='color:#f1c40f; margin:0; font-weight:bold;'>Pour \\( \\mu \\)</p><div class='math' style='color:white; font-size:1.1rem;'>$$ \\hat{\\mu}_{MLE} = \\bar{X} = \\frac{1}{n} \\sum X_i $$</div></div><div style='flex:1; min-width:150px; background:#34495e; padding:12px; border-radius:8px;'><p style='color:#f1c40f; margin:0; font-weight:bold;'>Pour \\( \\sigma^2 \\)</p><div class='math' style='color:white; font-size:1.1rem;'>$$ \\hat{\\sigma^2}_{MLE} = \\frac{1}{n} \\sum (X_i - \\bar{X})^2 $$</div></div></div></div><div style='background:#e8f4f8; padding:12px; border-radius:8px; margin-top:12px;'><p style='margin:0;'><strong>Important :</strong> L'estimateur de la variance par MLE est biaisé (il sous-estime \\( \\sigma^2 \\)). On utilise souvent \\( S^2 = \\frac{1}{n-1} \\sum (X_i - \\bar{X})^2 \\) pour corriger le biais.</p></div></div>",
    "texteParle": "Pour la loi normale, qui est très importante en statistique, le maximum de vraisemblance donne des estimateurs intéressants. L'estimateur de la moyenne mu est la moyenne empirique, ce qui est prévisible. En revanche, l'estimateur de la variance sigma carré par le MLE est biaisé : il sous-estime systématiquement la variance. C'est pourquoi on utilise souvent l'estimateur corrigé avec n-1 au dénominateur, qui est sans biais. Cette correction est importante quand on travaille avec des échantillons de petite taille.",
    "note": "L'estimateur MLE de la variance \\( \\sigma^2 \\) est biaisé, on utilise souvent la variance corrigée."
  },
  {
    "titre": "Propriétés des Estimateurs du MLE",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Les Estimateurs du MLE ont d'excellentes propriétés</h3><div style='display:flex; flex-direction:column; gap:10px; margin-top:10px;'><div style='background:#27ae60; padding:12px; border-radius:8px;'><p style='color:white; margin:0;'><strong>✓ Convergence :</strong> \\( \\hat{\\theta}_{MLE} \\xrightarrow[n \\to \\infty]{} \\theta \\)</p></div><div style='background:#2980b9; padding:12px; border-radius:8px;'><p style='color:white; margin:0;'><strong>✓ Efficacité asymptotique :</strong> Atteint la variance minimale pour les grands échantillons</p></div><div style='background:#8e44ad; padding:12px; border-radius:8px;'><p style='color:white; margin:0;'><strong>✓ Invariance :</strong> Si \\( \\hat{\\theta} \\) est le MLE de \\( \\theta \\), alors \\( g(\\hat{\\theta}) \\) est le MLE de \\( g(\\theta) \\)</p></div></div></div></div>",
    "texteParle": "Les estimateurs obtenus par la méthode du maximum de vraisemblance ont des propriétés exceptionnelles. D'abord, ils sont convergents : plus l'échantillon est grand, plus ils se rapprochent du vrai paramètre. Ensuite, ils sont asymptotiquement efficaces : pour les grands échantillons, ils atteignent la variance minimale possible. Enfin, ils possèdent une propriété d'invariance très pratique : si on connaît l'estimateur d'un paramètre, on peut facilement obtenir l'estimateur d'une fonction de ce paramètre. Ces propriétés expliquent pourquoi le MLE est si largement utilisé en Data Science.",
    "note": "Le MLE est la méthode d'estimation la plus utilisée en statistique moderne."
  },
  {
    "titre": "Erreur Standard",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Erreur Standard d'un Estimateur</h3><p style='color:white;'>L'erreur standard est l'<strong>écart-type</strong> de la distribution d'échantillonnage d'un estimateur.</p><div class='math-block' style='text-align:center; padding:10px; background:#34495e; border-radius:8px; margin:10px 0;'><div class='math' style='color:#f1c40f; font-size:1.2rem;'>$$ \\text{ES}(\\hat{\\theta}) = \\sqrt{\\text{Var}(\\hat{\\theta})} $$</div></div></div><div style='background:#16a085; color:white; padding:15px; border-radius:10px; margin-top:15px;'><h4 style='margin-top:0; color:#f1c40f;'>Exemple</h4><p style='color:white;'>Pour la moyenne empirique : \\( \\text{ES}(\\bar{X}) = \\frac{\\sigma}{\\sqrt{n}} \\)</p><p style='color:white;'>Plus \\( n \\) est grand, plus l'erreur standard est petite.</p></div></div>",
    "texteParle": "L'erreur standard d'un estimateur est une mesure très importante de sa précision. C'est l'écart-type de la distribution d'échantillonnage de l'estimateur. En d'autres termes, c'est une mesure de la variabilité de l'estimateur d'un échantillon à l'autre. Une petite erreur standard signifie que l'estimateur est précis, c'est-à-dire que les estimations sont peu dispersées. Pour la moyenne empirique, l'erreur standard est égale à l'écart-type de la population divisé par la racine carrée de la taille de l'échantillon. Vous voyez donc que plus l'échantillon est grand, plus l'erreur standard diminue.",
    "note": "L'erreur standard diminue lorsque la taille de l'échantillon augmente."
  },
  {
    "titre": "Récapitulatif - Bonnes Pratiques",
    "contenu": "<div style='font-size:1.05rem; line-height:1.8;'><div style='background:#2c3e50; color:white; padding:15px; border-radius:10px;'><h3 style='margin-top:0; color:#f1c40f;'>Ce qu'il faut retenir</h3><ul style='list-style-type:disc; padding-left:20px; color:white;'><li>Un <strong>estimateur</strong> est une formule, une <strong>estimation</strong> est une valeur numérique.</li><li>Un bon estimateur doit être : <strong>sans biais</strong>, <strong>convergent</strong> et <strong>efficace</strong>.</li><li>Le <strong>Maximum de Vraisemblance (MLE)</strong> est une méthode puissante pour trouver de bons estimateurs.</li><li>L'<strong>erreur standard</strong> mesure la précision de l'estimateur.</li><li>En Data Science, on utilise souvent : moyenne empirique, variance empirique, proportion empirique.</li></ul;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
